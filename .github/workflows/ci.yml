name: Yuji CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unittest
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python unit tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python -m unittest discover -s tests -p "test_*.py" -v

  pester-current:
    name: Pester current-version regressions
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 4.10.1
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          Get-Module Pester | Format-List Name,Version,Path

      - name: Run V0.34 Pester regressions
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1 -Force

          if (-not (Test-Path -LiteralPath .\VERSION_V0.34.txt -PathType Leaf)) {
            throw 'VERSION_V0.34.txt is missing.'
          }
          if ((Get-Content -LiteralPath .\VERSION_V0.34.txt -Raw).Trim() -ne 'V0.34') {
            throw 'VERSION_V0.34.txt does not contain V0.34.'
          }

          $buildSource = Get-Content -LiteralPath .\Build-CodexChatIndex.ps1 -Raw
          if ($buildSource -notmatch '\$builderVersion = "V0\.34"') {
            throw 'Build-CodexChatIndex.ps1 is not on V0.34.'
          }

          $openSource = Get-Content -LiteralPath .\Open-CodexChatIndex.cmd -Raw
          if ($openSource -notmatch 'V0\.34') {
            throw 'Open-CodexChatIndex.cmd is not on V0.34.'
          }

          $describeName = 'V0.32 managed images with V0.34 title and note interactions'
          $result = Invoke-Pester -Script .\tests\Build-CodexChatIndex.Tests.ps1 -TestName $describeName -PassThru
          if ($result.TotalCount -lt 1) {
            throw "Pester executed 0 tests for Describe '$describeName'."
          }
          Write-Host "Verified $($result.TotalCount) Pester tests in '$describeName'."
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

  pester-full:
    name: Pester full suite
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 4.10.1
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run full Pester suite
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          Invoke-Pester -Script .\tests\Build-CodexChatIndex.Tests.ps1 -EnableExit
