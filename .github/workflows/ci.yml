name: Yuji CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unittest
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python unit tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python -m unittest discover -s tests -p "test_*.py" -v

  pester-current:
    name: Pester current-version regressions
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 4.10.1
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          Get-Module Pester | Format-List Name,Version,Path

      - name: Run V0.34 Pester regressions
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1 -Force

          if (-not (Test-Path -LiteralPath .\VERSION_V0.34.txt -PathType Leaf)) {
            throw 'VERSION_V0.34.txt is missing.'
          }
          if ((Get-Content -LiteralPath .\VERSION_V0.34.txt -Raw).Trim() -ne 'V0.34') {
            throw 'VERSION_V0.34.txt does not contain V0.34.'
          }

          $patterns = @(
            '*streamlined V0.34 Yuji brand*',
            '*V0.34 builder and visible version markers*',
            '*single V0.34 HTML template source*',
            '*V0.34 bulk title-group toggle*',
            '*V0.34 bulk collapse*',
            '*V0.34 top arrow state*',
            '*Python cache artifacts*'
          )

          $total = 0
          $failed = 0
          foreach ($pattern in $patterns) {
            Write-Host "Running Pester pattern: $pattern"
            $result = Invoke-Pester -Script .\tests\Build-CodexChatIndex.Tests.ps1 -TestName $pattern -PassThru
            if ($result.TotalCount -ne 1) {
              throw "Expected exactly 1 test for pattern '$pattern', but Pester executed $($result.TotalCount)."
            }
            $total += $result.TotalCount
            $failed += $result.FailedCount
          }

          Write-Host "Verified $total current-version Pester tests."
          if ($failed -gt 0) {
            throw "$failed current-version Pester test(s) failed."
          }

  pester-full-diagnostic:
    name: Full Pester diagnostic
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 4.10.1
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run full Pester suite
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          Invoke-Pester -Script .\tests\Build-CodexChatIndex.Tests.ps1 -EnableExit
