    function getCurrentSourceId() {
      return typeof currentSourceId !== 'undefined' && currentSourceId ? currentSourceId : 'local-codex';
    }

    function getCurrentSource() {
      const id = getCurrentSourceId();
      const sources = typeof sourceState !== 'undefined' && sourceState && Array.isArray(sourceState.sources) ? sourceState.sources : [];
      const appSource = typeof APP !== 'undefined' && APP ? APP.source : null;
      return sources.find(source => source && source.id === id) || appSource || sources[0] || { id: 'local-codex', label: '本机 Codex', type: 'local-codex' };
    }

    async function loadSessionToken() {
      if (typeof location !== 'undefined' && location.protocol === 'file:') return '';
      const response = await fetch(SESSION_TOKEN_API_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('session token HTTP ' + response.status);
      const payload = await response.json();
      apiSessionToken = String((payload && payload.token) || '');
      if (!apiSessionToken) throw new Error('session token missing');
      return apiSessionToken;
    }

    function mutationFetch(url, options) {
      if (!apiSessionToken) return Promise.reject(new Error('本地会话令牌尚未加载'));
      const request = Object.assign({}, options || {});
      const headers = new Headers(request.headers || {});
      headers.set('X-Yuji-Session-Token', apiSessionToken);
      request.headers = headers;
      return fetch(url, request);
    }

    function fallbackSourceCapabilities(source) {
      const type = String((source && source.type) || '');
      if (type === 'local-codex' || type === 'local-claude') {
        return { canRefresh: true, canQuickRefresh: true, canRebuild: true, canUpload: true, canDownload: false, canResume: true, canReply: true, canEditNotes: true, canResolveLocalImages: true, isReadOnly: false };
      }
      if (type === 'webdav-codex' || type === 'webdav-claude') {
        return { canRefresh: false, canQuickRefresh: false, canRebuild: true, canUpload: false, canDownload: true, canResume: false, canReply: false, canEditNotes: false, canResolveLocalImages: false, isReadOnly: true };
      }
      return { canRefresh: true, canQuickRefresh: true, canRebuild: true, canUpload: false, canDownload: false, canResume: false, canReply: false, canEditNotes: true, canResolveLocalImages: true, isReadOnly: false };
    }

    function getSourceCapability(name, source) {
      const resolved = source || getCurrentSource();
      const capabilities = resolved && resolved.capabilities && typeof resolved.capabilities === 'object'
        ? resolved.capabilities
        : fallbackSourceCapabilities(resolved);
      return !!capabilities[name];
    }

    function isExternalSource() {
      return !getSourceCapability('canReply');
    }

    function isWebdavSource(source) {
      const type = String(((source || getCurrentSource()) && (source || getCurrentSource()).type) || '');
      return type === 'webdav-codex' || type === 'webdav-claude';
    }

    function currentSyncAction() {
      if (getSourceCapability('canUpload')) return 'upload';
      if (getSourceCapability('canDownload')) return 'download';
      return 'none';
    }

    function formatBytes(value) {
      let bytes = Math.max(0, Number(value) || 0);
      const units = ['B', 'KiB', 'MiB', 'GiB'];
      let unit = 0;
      while (bytes >= 1024 && unit < units.length - 1) {
        bytes /= 1024;
        unit++;
      }
      return (unit ? bytes.toFixed(bytes >= 10 ? 1 : 2) : Math.round(bytes)) + ' ' + units[unit];
    }

    function setWebdavStatus(message, error) {
      if (!webdavStatus) return;
      webdavStatus.textContent = String(message || '');
      webdavStatus.classList.toggle('is-error', !!error);
    }

    function formatWebdavCleanupFailures(summary, failed) {
      const failures = Array.isArray(failed) ? failed : [];
      const details = failures.map((item, index) => {
        const current = item && typeof item === 'object' ? item : {};
        return [
          (index + 1) + '. 来源：' + String(current.sourceId || '未知来源'),
          '区域：' + String(current.area || '未知区域'),
          '路径：' + String(current.path || '未知路径'),
          '原因：' + String(current.reason || '未知原因'),
        ].join('\n');
      });
      return [String(summary || '本机缓存清理失败')].concat(details).join('\n\n');
    }

    function renderWebdavCache() {
      if (!webdavCacheList) return;
      const entries = webdavState.settings && Array.isArray(webdavState.settings.cache) ? webdavState.settings.cache : [];
      if (!entries.length) {
        webdavCacheList.innerHTML = '';
        return;
      }
      webdavCacheList.innerHTML = entries.map(entry =>
        '<div class="cloud-cache-row"><span>' + escapeHtml(entry.label || entry.sourceId || '') + '</span>' +
        '<span>' + escapeHtml(formatBytes(entry.bytes)) + '</span>' +
        '<button type="button" data-clear-cloud-cache="' + escapeHtml(entry.sourceId || '') + '">清除</button></div>'
      ).join('');
    }

    function formatWebdavTaskError(task) {
      const current = task && typeof task === 'object' ? task : {};
      const actionLabels = { upload: '上传', download: '下载' };
      const lines = [
        '操作：' + (actionLabels[current.action] || String(current.action || '未知操作')),
        '阶段：' + String(current.stage || '未知阶段')
      ];
      const httpStatus = Number(current.httpStatus) || 0;
      if (httpStatus) lines.push('HTTP 状态：' + httpStatus);
      lines.push('原因：' + String(current.errorReason || current.errorSummary || '未知错误'));
      const retryAfter = String(current.retryAfter || '').trim();
      if (retryAfter) lines.push('Retry-After: ' + retryAfter);
      if (current.updatedAt) lines.push('发生时间：' + String(current.updatedAt));
      if (current.errorTarget) lines.push('脱敏地址：' + String(current.errorTarget));
      lines.push('建议检查：服务器地址、账号、应用密码、远端目录、私网 HTTP 许可和网络连接。');
      return lines.join('\n');
    }

    function renderWebdavTask(task) {
      webdavState.task = task && typeof task === 'object' ? task : null;
      const current = webdavState.task || { status: 'idle', percent: 0 };
      if (webdavTaskProgress) webdavTaskProgress.value = Math.max(0, Math.min(100, Number(current.percent) || 0));
      if (webdavTaskText) {
        if (current.status === 'idle') {
          webdavTaskText.textContent = '当前没有传输任务';
        } else if (current.status === 'error') {
          webdavTaskText.textContent = formatWebdavTaskError(current) + (current.warning ? '；' + current.warning : '');
        } else if (current.warning) {
          webdavTaskText.textContent = String(current.warning);
        } else {
          const counts = current.bytesTotal
            ? formatBytes(current.bytesDone) + ' / ' + formatBytes(current.bytesTotal)
            : ((current.filesDone || 0) + ' / ' + (current.filesTotal || 0) + ' 个文件');
          webdavTaskText.textContent = [current.stage || current.status, counts, (current.percent || 0) + '%'].filter(Boolean).join(' · ');
        }
      }
      if (webdavCancelTask) {
        webdavCancelTask.hidden = !current.canCancel;
        webdavCancelTask.disabled = !current.canCancel || !!current.cancelRequested;
      }
      updateTopSourceActions();
    }

    function updateTopSourceActions() {
      const source = getCurrentSource();
      const status = webdavState.sourceStatus;
      const task = webdavState.task;
      const settings = webdavState.settings;
      if (refreshButton) {
        const refreshState = status && status.refresh ? status.refresh.state : '';
        refreshButton.disabled = !getSourceCapability('canRefresh', source) || refreshState === 'latest' || refreshState === 'checking';
        refreshButton.classList.toggle('is-error', refreshState === 'error');
      }
      if (rebuildButton) {
        rebuildButton.disabled = !getSourceCapability('canRebuild', source) || (isWebdavSource(source) && !source.downloaded);
      }
      if (!syncButton) return;
      const action = currentSyncAction();
      const enabled = !!(settings && settings.enabled);
      syncButton.hidden = !enabled || action === 'none';
      if (syncButton.hidden) return;
      const label = action === 'upload' ? '上传' : '下载';
      const runningHere = task && ['running', 'cancelling'].includes(task.status) && task.sourceId === getCurrentSourceId();
      const syncState = status && status.sync ? status.sync.state : '';
      syncButton.textContent = runningHere ? (label + ' ' + (task.percent || 0) + '%') : label;
      syncButton.disabled = runningHere || syncState === 'latest' || syncState === 'checking';
      syncButton.classList.toggle('is-loading', !!runningHere);
      syncButton.classList.toggle('is-error', syncState === 'error');
      syncButton.title = status && status.sync ? String(status.sync.reason || '') : '';
    }

    function applyWebdavSettings(settings) {
      webdavState.settings = settings && typeof settings === 'object' ? settings : null;
      const value = webdavState.settings || {};
      if (webdavBaseUrl) webdavBaseUrl.value = value.baseUrl || 'https://dav.jianguoyun.com/dav/';
      if (webdavUsername) webdavUsername.value = value.username || '';
      if (webdavPassword) {
        webdavPassword.value = '';
        webdavPassword.placeholder = value.passwordSaved ? '已保存，留空不修改' : '未保存';
      }
      if (webdavRemoteRoot) webdavRemoteRoot.value = value.remoteRoot || 'YujiSync';
      if (webdavDeviceName) webdavDeviceName.value = value.deviceDisplayName || '';
      if (webdavAllowHttp) webdavAllowHttp.checked = !!value.allowInsecurePrivateHttp;
       if (value.identityError) setWebdavStatus(value.identityError, true);
       else if (value.recoveryError) setWebdavStatus(value.recoveryError, true);
       else if (value.warning) setWebdavStatus(value.warning, true);
       else if (value.cacheWarnings && value.cacheWarnings.length) setWebdavStatus(formatWebdavCleanupFailures('本机缓存列表不完整，以下路径暂时无法读取：', value.cacheWarnings), true);
       else if (value.lastCheck && value.lastCheck.checkedAt) setWebdavStatus(value.lastCheck.ok ? (value.lastCheck.message || '最近检查通过：' + value.lastCheck.checkedAt) : (value.lastCheck.message || value.lastCheck.error), !value.lastCheck.ok);
      else setWebdavStatus(value.enabled ? 'WebDAV 已启用' : 'WebDAV 未启用', false);
      renderWebdavCache();
      renderWebdavTask(value.task || webdavState.task);
      updateTopSourceActions();
    }

    async function loadWebdavSettings() {
      const response = await fetch(WEBDAV_API_ROOT + '/settings', { cache: 'no-store' });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || ('HTTP ' + response.status));
      applyWebdavSettings(payload);
      return payload;
    }

    function collectWebdavForm() {
      return {
        enabled: true,
        baseUrl: webdavBaseUrl ? webdavBaseUrl.value.trim() : '',
        username: webdavUsername ? webdavUsername.value.trim() : '',
        password: webdavPassword ? webdavPassword.value : '',
        remoteRoot: webdavRemoteRoot ? webdavRemoteRoot.value.trim() : '',
        deviceDisplayName: webdavDeviceName ? webdavDeviceName.value.trim() : '',
        allowInsecurePrivateHttp: !!(webdavAllowHttp && webdavAllowHttp.checked)
      };
    }

    async function webdavMutation(path, body, method) {
      const response = await mutationFetch(WEBDAV_API_ROOT + path, {
        method: method || 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.ok === false) {
        const error = new Error(payload.error || payload.message || payload.warning || ('HTTP ' + response.status));
        error.payload = payload;
        throw error;
      }
      return payload;
    }

    async function openWebdavSettings() {
      if (typeof closeSearchHistoryMenu === 'function') closeSearchHistoryMenu();
      if (webdavUnregisterClearCache) webdavUnregisterClearCache.checked = false;
      try {
        await loadWebdavSettings();
        if (webdavModal) webdavModal.hidden = false;
        if (webdavBaseUrl) requestAnimationFrame(() => webdavBaseUrl.focus());
      } catch (error) {
        showToast('云设置加载失败：' + (error.message || '未知错误'), { tone: 'error', duration: 3200 });
      }
    }

    function closeWebdavSettings() {
      if (webdavModal) webdavModal.hidden = true;
      if (webdavPassword) webdavPassword.value = '';
      if (webdavUnregisterClearCache) webdavUnregisterClearCache.checked = false;
      setWebdavStatus('', false);
    }

    async function refreshCloudSources(force) {
      const now = Date.now();
      if (!force && now - webdavState.lastCatalogCheckAt < 60000) return;
      webdavState.lastCatalogCheckAt = now;
      try {
        const response = await fetch(SOURCES_API_URL + '?refreshWebdav=1', { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok || !Array.isArray(payload.sources)) throw new Error(payload.error || ('HTTP ' + response.status));
        sourceState = payload;
        if (!payload.sources.some(source => source.id === getCurrentSourceId())) currentSourceId = payload.selectedSourceId || 'local-codex';
        renderSourceSelect();
      } catch (error) {
        console.warn('云端来源检查失败', error);
      }
    }

    async function checkCurrentSourceStatus(force) {
      webdavState.lastStatusCheckAt = Date.now();
      const action = currentSyncAction();
      if (action === 'none') {
        webdavState.sourceStatus = null;
        updateTopSourceActions();
        return null;
      }
      try {
        const url = SOURCE_STATUS_API_URL + '?sourceId=' + encodeURIComponent(getCurrentSourceId()) + (force ? '&force=1' : '');
        const response = await fetch(url, { cache: 'no-store' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || ('HTTP ' + response.status));
        webdavState.sourceStatus = payload;
        updateTopSourceActions();
        return payload;
      } catch (error) {
        webdavState.sourceStatus = { refresh: { state: 'error', reason: error.message || '' }, sync: { action, state: 'error', reason: error.message || '' } };
        updateTopSourceActions();
        return null;
      }
    }

    async function pollWebdavTask() {
      if (webdavState.pollTimer) {
        clearTimeout(webdavState.pollTimer);
        webdavState.pollTimer = 0;
      }
      try {
        const response = await fetch(WEBDAV_API_ROOT + '/task', { cache: 'no-store' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || ('HTTP ' + response.status));
        const task = payload.task || { status: 'idle' };
        const signature = [task.taskId, task.status, task.updatedAt].join(':');
        const changed = signature && signature !== webdavState.lastTaskSignature;
        webdavState.lastTaskSignature = signature;
        renderWebdavTask(task);
        if (typeof document === 'undefined' || document.visibilityState !== 'hidden') {
          if (Date.now() - webdavState.lastStatusCheckAt >= 60000) {
            await refreshCloudSources(false);
            await checkCurrentSourceStatus(false);
          }
        }
        if (changed && task.status === 'needs-confirmation' && task.confirmationToken) {
          if (confirm(task.errorSummary || '本次上传包含大量删除，确定继续吗？')) {
            await startCurrentSync(task.confirmationToken);
          }
        } else if (changed && task.status === 'completed') {
          await handleCompletedWebdavTask(task);
        } else if (changed && task.status === 'error') {
          showToast('云任务失败：' + formatWebdavTaskError(task), { tone: 'error', duration: 4200 });
        }
      } catch (error) {
        console.warn('云任务状态读取失败', error);
      } finally {
        const active = webdavState.task && ['running', 'cancelling'].includes(webdavState.task.status);
        webdavState.pollTimer = setTimeout(() => { void pollWebdavTask(); }, active ? 1200 : 12000);
      }
    }

    async function handleCompletedWebdavTask(task) {
      await loadWebdavSettings().catch(() => null);
      await refreshCloudSources(true);
      if (task.action === 'download' && task.sourceId === getCurrentSourceId()) {
        await reloadCurrentSourceAfterDownload();
      }
      await checkCurrentSourceStatus(true);
      showToast(task.action === 'download' ? '云端来源已下载' : '本机来源已上传', { duration: 2600 });
    }

    async function reloadCurrentSourceAfterDownload() {
      if (webdavState.reloadingDownload) return;
      webdavState.reloadingDownload = true;
      const previousSession = getSelectedSession();
      const previousKey = previousSession ? getSessionKey(previousSession) : '';
      const anchor = typeof captureProgressAnchor === 'function' ? captureProgressAnchor(previousSession) : null;
      if (anchor && typeof saveProgressAnchor === 'function') saveProgressAnchor(anchor);
      const restoreToken = ++progressRestoreToken;
      try {
        CURRENT_DETAIL = null;
        sessionCache.clear();
        await loadIndex();
        let restoredWorkspace = null;
        let restoredSession = null;
        for (const workspace of APP.workspaces || []) {
          const match = (workspace.sessions || []).find(session => getSessionKey(session) === previousKey);
          if (match) {
            restoredWorkspace = workspace;
            restoredSession = match;
            break;
          }
        }
        if (previousKey && !restoredSession) {
          selectedWorkspaceId = null;
          selectedSessionKey = null;
        } else if (restoredSession) {
          selectedWorkspaceId = restoredWorkspace.id;
          selectedSessionKey = getSessionKey(restoredSession);
        }
        await loadNotes();
        updateStats();
        refreshFilterMenus();
        renderWorkspaceList(true);
        if (restoredSession) {
          const detail = await loadSessionDetail(restoredSession);
          applyLoadedDetail(restoredSession, detail);
        } else {
          clearCurrentDetail();
        }
        renderViewer();
        if (anchor && restoredSession) restoreProgressAnchor(anchor, { token: restoreToken, behavior: 'auto' });
        if (previousKey && !restoredSession) transcript.innerHTML = '<div class="empty-state">当前会话已不存在。</div>';
      } finally {
        webdavState.reloadingDownload = false;
      }
    }

    async function startCurrentSync(confirmationToken) {
      const action = currentSyncAction();
      if (action === 'none') return;
      try {
        const payload = await webdavMutation('/' + action, { sourceId: getCurrentSourceId(), confirmationToken: confirmationToken || '' });
        renderWebdavTask(payload.task);
        await pollWebdavTask();
      } catch (error) {
        showToast((action === 'upload' ? '上传' : '下载') + '启动失败：' + (error.message || '未知错误'), { tone: 'error', duration: 3600 });
      }
    }

    function buildSourceUrl(url) {
      if (typeof location !== 'undefined' && location.protocol === 'file:') return url;
      return SOURCE_DATA_API_URL + '?sourceId=' + encodeURIComponent(getCurrentSourceId());
    }

    function renderSourceSelect() {
      if (!sourceSelect) return;
      const sources = Array.isArray(sourceState.sources) && sourceState.sources.length
        ? sourceState.sources
        : [{ id: 'local-codex', label: '本机 Codex', type: 'local-codex' }];
      sourceSelect.innerHTML = sources.map(source => {
        const id = String(source.id || 'local-codex');
        const label = String(source.label || id);
        return '<option value="' + escapeHtml(id) + '">' + escapeHtml(label) + '</option>';
      }).join('');
      sourceSelect.value = getCurrentSourceId();
      const selectedSource = sources.find(source => source && String(source.id || '') === sourceSelect.value);
      const label = String((selectedSource && selectedSource.label) || sourceSelect.value || '');
      sourceSelect.title = label;
      sourceSelect.disabled = sources.length <= 1;
      updateTopSourceActions();
    }

    async function loadSources() {
      try {
        const response = await fetch(SOURCES_API_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const payload = await response.json();
        if (payload && Array.isArray(payload.sources) && payload.sources.length) {
          sourceState = payload;
          currentSourceId = payload.selectedSourceId || 'local-codex';
        }
      } catch (error) {
        sourceState = {
          selectedSourceId: 'local-codex',
          sources: [{ id: 'local-codex', label: '本机 Codex', type: 'local-codex' }]
        };
        currentSourceId = 'local-codex';
      }
      renderSourceSelect();
    }

    async function saveSelectedSource(sourceId) {
      if (typeof location !== 'undefined' && location.protocol === 'file:') return;
      try {
        await mutationFetch(SOURCES_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selectedSourceId: sourceId })
        });
      } catch (error) {
      }
    }

    function resetSourceScopedState() {
      saveProgressAnchorForCurrentSession();
      selectedWorkspaceId = null;
      selectedSessionKey = null;
      selectedQuestionKey = null;
      selectedQuestionKeyIsTemporary = false;
      pendingQuestionFocus = 'last';
      pendingAnswerFocusQuestionKey = null;
      progressRestoreToken++;
      CURRENT_DETAIL = null;
      sessionCache.clear();
      notesState.notes = new Map();
      notesState.loaded = false;
      viewerSearchQuery = '';
      viewerSearchQuestionsOnly = false;
      viewerSearchScope = 'all';
      if (viewerSearchInput) viewerSearchInput.value = '';
      if (globalSearchState.timer) {
        clearTimeout(globalSearchState.timer);
      }
      globalSearchState = {
        query: '',
        field: 'all',
        pending: false,
        matchKeys: null,
        requestId: globalSearchState.requestId + 1,
        timer: 0,
        error: ''
      };
    }

    async function loadIndex() {
      let response = await fetch(buildSourceUrl(INDEX_URL), { cache: 'no-store' });
      if (!response.ok && getCurrentSourceId() === 'local-codex') {
        response = await fetch(INDEX_URL, { cache: 'no-store' });
      }
      if (!response.ok) throw new Error('index HTTP ' + response.status);
      APP = await response.json();
      if (!APP || typeof APP !== 'object') APP = {};
      if (!Array.isArray(APP.workspaces)) APP.workspaces = [];
      if (!APP.source) APP.source = getCurrentSource();
      currentSourceId = (APP.source && APP.source.id) || getCurrentSourceId();
      if (sourceState && sourceState.selectedSourceId !== currentSourceId) sourceState.selectedSourceId = currentSourceId;
      renderSourceSelect();
      prepareData();
      selectedWorkspaceId = APP.workspaces[0] ? APP.workspaces[0].id : null;
      selectedSessionKey = APP.workspaces[0] && APP.workspaces[0].sessions[0] ? APP.workspaces[0].sessions[0].key : null;
    }

    async function loadSelectedDetailIfAvailable() {
      const first = getSelectedSession();
      if (!first) return;
      const detail = await loadSessionDetail(first);
      applyLoadedDetail(first, detail);
    }

    async function switchSource(sourceId) {
      const nextSourceId = String(sourceId || 'local-codex');
      if (!nextSourceId || nextSourceId === getCurrentSourceId()) return;
      if (typeof closeSearchHistoryMenu === 'function') closeSearchHistoryMenu();
      currentSourceId = nextSourceId;
      if (sourceSelect) sourceSelect.value = nextSourceId;
      await saveSelectedSource(nextSourceId);
      resetSourceScopedState();
      viewerHead.innerHTML = '<div class="empty-state">正在加载来源...</div>';
      transcript.innerHTML = '';
      await loadIndex();
      await loadNotes();
      updateStats();
      refreshFilterMenus();
      renderWorkspaceList(true);
      try {
        await loadSelectedDetailIfAvailable();
      } catch (error) {
        console.warn('来源切换后加载会话详情失败', error);
      }
      renderViewer();
      webdavState.sourceStatus = null;
      updateTopSourceActions();
      void checkCurrentSourceStatus(true);
    }

    async function loadSessionDetail(session) {
      const key = getSessionKey(session);
      if (sessionCache.has(key)) {
        return sessionCache.get(key);
      }
      if (!session || !session.detailHref) throw new Error('detail href missing');

      const response = await fetch(session.detailHref, { cache: 'no-store' });
      if (!response.ok) throw new Error('detail HTTP ' + response.status);
      return await response.json();
    }

    function cacheCurrentDetail(key, detail) {
      sessionCache.clear();
      sessionCache.set(key, detail);
      CURRENT_DETAIL = detail;
    }

    function clearCurrentDetail() {
      sessionCache.clear();
      CURRENT_DETAIL = null;
      selectedQuestionKey = null;
      selectedQuestionKeyIsTemporary = false;
      pendingAnswerFocusQuestionKey = null;
      transcript.innerHTML = '';
    }

    function prepareData() {
      (APP.workspaces || []).forEach(workspace => {
        workspace._search = (workspace.cwd || '').toLowerCase();
        workspace.sessions.forEach(session => {
          session._search = [session.title, session.summary, session.path, workspace.cwd].join(' ').toLowerCase();
        });
      });
    }

    function normalizeSearchHistoryQuery(value) {
      return String(value == null ? '' : value).trim().replace(/\s+/g, ' ');
    }

    function getSearchHistoryDedupKey(value) {
      return normalizeSearchHistoryQuery(value).replace(/[A-Z]/g, character => character.toLowerCase());
    }

    function sanitizeSearchHistoryItems(items) {
      const output = [];
      const seen = new Set();
      (Array.isArray(items) ? items : []).some(item => {
        if (typeof item !== 'string') return false;
        const normalized = normalizeSearchHistoryQuery(item);
        const key = getSearchHistoryDedupKey(normalized);
        if (!normalized || seen.has(key)) return false;
        seen.add(key);
        output.push(normalized);
        return output.length >= SEARCH_HISTORY_LIMIT;
      });
      return output;
    }

    function isSearchHistoryQuotaError(error) {
      if (!error) return false;
      return error.name === 'QuotaExceededError' ||
        error.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
        error.code === 22 || error.code === 1014;
    }

    function updateSearchHistoryButtonState() {
      if (!viewerSearchHistoryButton) return;
      const open = !!(viewerSearchHistoryMenu && !viewerSearchHistoryMenu.hidden);
      viewerSearchHistoryButton.disabled = !searchHistoryItems.length;
      viewerSearchHistoryButton.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (viewerSearchInput) viewerSearchInput.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function persistSearchHistoryItems(options) {
      const settings = options || {};
      if (!searchHistoryStorageWritable || typeof window === 'undefined') {
        updateSearchHistoryButtonState();
        return false;
      }
      const original = searchHistoryItems.slice(0, SEARCH_HISTORY_LIMIT);
      const candidates = original.slice();
      while (true) {
        try {
          if (candidates.length) {
            window.localStorage.setItem(SEARCH_HISTORY_STORAGE_KEY, JSON.stringify({ version: 1, items: candidates }));
          } else {
            window.localStorage.removeItem(SEARCH_HISTORY_STORAGE_KEY);
          }
          searchHistoryItems = candidates;
          updateSearchHistoryButtonState();
          return true;
        } catch (error) {
          if (isSearchHistoryQuotaError(error) && candidates.length > 1) {
            candidates.pop();
            continue;
          }
          if (!isSearchHistoryQuotaError(error)) searchHistoryStorageWritable = false;
          searchHistoryItems = original;
          updateSearchHistoryButtonState();
          if (settings.notifyFailure) showToast('搜索历史无法保存，当前搜索不受影响', { tone: 'error', duration: 2400 });
          return false;
        }
      }
    }

    function loadSearchHistory() {
      searchHistoryItems = [];
      if (typeof window === 'undefined') {
        updateSearchHistoryButtonState();
        return;
      }
      let raw = null;
      let parsed = null;
      try {
        raw = window.localStorage.getItem(SEARCH_HISTORY_STORAGE_KEY);
      } catch (error) {
        searchHistoryStorageWritable = false;
        updateSearchHistoryButtonState();
        return;
      }
      if (raw) {
        try {
          parsed = JSON.parse(raw);
        } catch (error) {
          parsed = null;
        }
      }
      const supported = parsed && parsed.version === 1 && Array.isArray(parsed.items);
      searchHistoryItems = sanitizeSearchHistoryItems(supported ? parsed.items : []);
      updateSearchHistoryButtonState();
      if (!raw) return;
      const normalizedPayload = JSON.stringify({ version: 1, items: searchHistoryItems });
      if (!supported || raw !== normalizedPayload) persistSearchHistoryItems();
    }

    function getFilteredSearchHistoryItems() {
      const filter = getSearchHistoryDedupKey(viewerSearchInput ? viewerSearchInput.value : viewerSearchQuery);
      if (!filter) return searchHistoryItems.slice();
      return searchHistoryItems.filter(item => getSearchHistoryDedupKey(item).includes(filter));
    }

    function resetSearchHistoryClearConfirmation() {
      if (searchHistoryClearTimer) {
        clearTimeout(searchHistoryClearTimer);
        searchHistoryClearTimer = 0;
      }
      if (viewerSearchHistoryClear) viewerSearchHistoryClear.textContent = '清空历史';
    }

    function closeSearchHistoryMenu() {
      resetSearchHistoryClearConfirmation();
      searchHistoryHighlightIndex = -1;
      if (viewerSearchHistoryMenu) viewerSearchHistoryMenu.hidden = true;
      if (viewerSearchInput) viewerSearchInput.removeAttribute('aria-activedescendant');
      updateSearchHistoryButtonState();
    }

    function setSearchHistoryHighlight(index, options) {
      if (!viewerSearchHistoryMenu || viewerSearchHistoryMenu.hidden) return;
      const rows = Array.from(viewerSearchHistoryList.querySelectorAll('.search-history-item'));
      if (!rows.length) {
        searchHistoryHighlightIndex = -1;
        return;
      }
      searchHistoryHighlightIndex = Math.max(0, Math.min(rows.length - 1, index));
      rows.forEach((row, rowIndex) => {
        const active = rowIndex === searchHistoryHighlightIndex;
        row.classList.toggle('is-active', active);
        row.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      const activeRow = rows[searchHistoryHighlightIndex];
      if (viewerSearchInput && activeRow) viewerSearchInput.setAttribute('aria-activedescendant', activeRow.id);
      if (activeRow && (!options || options.scroll !== false)) activeRow.scrollIntoView({ block: 'nearest' });
    }

    function renderSearchHistoryMenu() {
      if (!viewerSearchHistoryList || !viewerSearchHistoryMenu) return false;
      const items = getFilteredSearchHistoryItems();
      viewerSearchHistoryList.replaceChildren();
      if (!items.length) {
        closeSearchHistoryMenu();
        return false;
      }
      const fragment = document.createDocumentFragment();
      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.id = 'viewerSearchHistoryOption-' + index;
        row.className = 'search-history-item';
        row.setAttribute('role', 'option');
        row.setAttribute('aria-selected', 'false');
        row._searchHistoryValue = item;

        const valueButton = document.createElement('button');
        valueButton.type = 'button';
        valueButton.className = 'search-history-value';
        valueButton.title = item;
        valueButton.textContent = item;

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'search-history-delete';
        deleteButton.title = '删除这条搜索历史';
        deleteButton.setAttribute('aria-label', '删除搜索历史：' + item);
        deleteButton.textContent = '删除';

        row.append(valueButton, deleteButton);
        fragment.appendChild(row);
      });
      viewerSearchHistoryList.appendChild(fragment);
      searchHistoryHighlightIndex = Math.max(-1, Math.min(searchHistoryHighlightIndex, items.length - 1));
      if (searchHistoryHighlightIndex >= 0) setSearchHistoryHighlight(searchHistoryHighlightIndex, { scroll: false });
      return true;
    }

    function openSearchHistoryMenu(options) {
      if (!viewerSearchHistoryMenu || !searchHistoryItems.length) return false;
      viewerSearchHistoryMenu.hidden = false;
      if (!renderSearchHistoryMenu()) return false;
      updateSearchHistoryButtonState();
      const settings = options || {};
      if (Number.isInteger(settings.highlightIndex)) setSearchHistoryHighlight(settings.highlightIndex);
      return true;
    }

    function confirmSearchHistoryQuery(value) {
      const normalized = normalizeSearchHistoryQuery(value === undefined
        ? (viewerSearchInput ? viewerSearchInput.value : viewerSearchQuery)
        : value);
      if (!normalized) return '';
      const key = getSearchHistoryDedupKey(normalized);
      searchHistoryItems = [normalized].concat(searchHistoryItems.filter(item => getSearchHistoryDedupKey(item) !== key)).slice(0, SEARCH_HISTORY_LIMIT);
      persistSearchHistoryItems({ notifyFailure: true });
      if (viewerSearchHistoryMenu && !viewerSearchHistoryMenu.hidden) renderSearchHistoryMenu();
      return normalized;
    }

    function useSearchHistoryItem(value) {
      const normalized = normalizeSearchHistoryQuery(value);
      if (!normalized) return;
      if (viewerSearchInput) viewerSearchInput.value = normalized;
      viewerSearchQuery = normalized;
      confirmSearchHistoryQuery(normalized);
      if (viewerSearchInput) viewerSearchInput.focus({ preventScroll: true });
      if (typeof closeSearchHistoryMenu === 'function') closeSearchHistoryMenu();
      scheduleViewerSearch({ immediate: true });
    }

    function moveSearchHistoryHighlight(direction) {
      const items = getFilteredSearchHistoryItems();
      if (!items.length) return false;
      if (!viewerSearchHistoryMenu || viewerSearchHistoryMenu.hidden) {
        const initial = direction < 0 ? items.length - 1 : 0;
        return openSearchHistoryMenu({ highlightIndex: initial });
      }
      const next = searchHistoryHighlightIndex < 0
        ? (direction < 0 ? items.length - 1 : 0)
        : (searchHistoryHighlightIndex + direction + items.length) % items.length;
      setSearchHistoryHighlight(next);
      return true;
    }

    function deleteSearchHistoryItem(value) {
      const key = getSearchHistoryDedupKey(value);
      const previousHighlight = searchHistoryHighlightIndex;
      searchHistoryItems = searchHistoryItems.filter(item => getSearchHistoryDedupKey(item) !== key);
      persistSearchHistoryItems({ notifyFailure: true });
      if (!searchHistoryItems.length) {
        closeSearchHistoryMenu();
        return;
      }
      if (!renderSearchHistoryMenu()) return;
      const remaining = getFilteredSearchHistoryItems();
      if (remaining.length) setSearchHistoryHighlight(Math.min(Math.max(previousHighlight, 0), remaining.length - 1));
    }

    function clearSearchHistory() {
      if (!searchHistoryClearTimer) {
        if (viewerSearchHistoryClear) viewerSearchHistoryClear.textContent = '再次点击确认清空';
        searchHistoryClearTimer = setTimeout(resetSearchHistoryClearConfirmation, SEARCH_HISTORY_CLEAR_CONFIRM_MS);
        return;
      }
      resetSearchHistoryClearConfirmation();
      const previousItems = searchHistoryItems.slice();
      searchHistoryItems = [];
      if (!persistSearchHistoryItems({ notifyFailure: true })) {
        searchHistoryItems = previousItems;
        updateSearchHistoryButtonState();
        if (viewerSearchHistoryMenu && !viewerSearchHistoryMenu.hidden) renderSearchHistoryMenu();
        return false;
      }
      if (typeof closeSearchHistoryMenu === 'function') closeSearchHistoryMenu();
      showToast('搜索历史已清空', { duration: 1800 });
      return true;
    }

    function getGlobalSearchQuery() {
      if (viewerSearchScope === 'current') return '';
      return (viewerSearchQuery || '').trim();
    }

    function getGlobalSearchField() {
      return viewerSearchQuestionsOnly ? 'questions' : 'all';
    }

    function hasLibrarySearchQuery() {
      return viewerSearchScope === 'all' && !!String(viewerSearchQuery || '').trim();
    }

    function getGlobalSearchHitSet() {
      return globalSearchState.matchKeys;
    }

    function sessionMatchesGlobalSearch(session) {
      const query = getGlobalSearchQuery();
      if (!query) return true;
      const hits = getGlobalSearchHitSet();
      return !!(hits && hits.has(getSessionKey(session)));
    }

    function getGlobalSearchEmptyText() {
      if (viewerSearchQuestionsOnly && getSearchTerms(viewerSearchQuery).length) {
        return '没有匹配这些关键词的提问。';
      }
      if (!getGlobalSearchQuery()) return '';
      if (globalSearchState.pending) return '正在搜索所有会话...';
      if (globalSearchState.error) return '搜索失败：' + globalSearchState.error;
      return '没有匹配“' + viewerSearchQuery + '”的内容。';
    }

    function getEmptySourceText() {
      const source = getCurrentSource();
      if (isWebdavSource(source) && !source.downloaded) return '此云端来源尚未下载。';
      if (APP && APP.needsBuild) return '当前来源尚未扫描，请点击刷新。';
      if (source && source.type === 'external-codex-jsonl' && APP && !APP.totalSessions) {
        return '当前外部来源还没有可显示的会话，请点击刷新扫描这个来源。';
      }
      return '';
    }

    function scheduleGlobalSearch(options) {
      const settings = options || {};
      const query = getGlobalSearchQuery();
      const field = getGlobalSearchField();
      if (globalSearchState.timer) {
        clearTimeout(globalSearchState.timer);
        globalSearchState.timer = 0;
      }

      if (!query) {
        globalSearchState.query = '';
        globalSearchState.field = field;
        globalSearchState.pending = false;
        globalSearchState.matchKeys = null;
        globalSearchState.error = '';
        renderWorkspaceList(true);
        renderViewer();
        return;
      }

      globalSearchState.pending = true;
      globalSearchState.field = field;
      globalSearchState.error = '';
      globalSearchState.matchKeys = new Set();
      renderWorkspaceList(true);
      renderViewer();
      if (settings.immediate) {
        void runGlobalSearch(query, field);
      } else {
        globalSearchState.timer = setTimeout(() => {
          void runGlobalSearch(query, field);
        }, 240);
      }
    }

    function resetGlobalSearchStateForCurrentScope() {
      if (currentScopeSearchTimer) {
        clearTimeout(currentScopeSearchTimer);
        currentScopeSearchTimer = 0;
      }
      if (globalSearchState.timer) {
        clearTimeout(globalSearchState.timer);
        globalSearchState.timer = 0;
      }
      globalSearchState.query = '';
      globalSearchState.field = getGlobalSearchField();
      globalSearchState.pending = false;
      globalSearchState.matchKeys = null;
      globalSearchState.error = '';
      globalSearchState.requestId++;
    }

    function scheduleViewerSearch(options) {
      const settings = options || {};
      if (viewerSearchScope === 'current') {
        if (currentScopeSearchTimer) {
          clearTimeout(currentScopeSearchTimer);
          currentScopeSearchTimer = 0;
        }
        resetGlobalSearchStateForCurrentScope();
        if (settings.immediate) {
          renderViewer();
        } else {
          currentScopeSearchTimer = setTimeout(() => {
            currentScopeSearchTimer = 0;
            renderViewer();
          }, CURRENT_SCOPE_SEARCH_DELAY_MS);
        }
        return;
      }
      if (currentScopeSearchTimer) {
        clearTimeout(currentScopeSearchTimer);
        currentScopeSearchTimer = 0;
      }
      scheduleGlobalSearch(settings);
    }

    async function runGlobalSearch(query, field) {
      const normalizedQuery = String(query || '').trim();
      const normalizedField = field === 'questions' ? 'questions' : 'all';
      const requestId = ++globalSearchState.requestId;
      if (!normalizedQuery) {
        scheduleGlobalSearch();
        return;
      }

      try {
        const response = await fetch(SEARCH_API_URL + '?sourceId=' + encodeURIComponent(getCurrentSourceId()) + '&field=' + encodeURIComponent(normalizedField) + '&q=' + encodeURIComponent(normalizedQuery), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const payload = await response.json();
        if (requestId !== globalSearchState.requestId) return;
        if ((getGlobalSearchQuery() || '') !== normalizedQuery) return;
        if (getGlobalSearchField() !== normalizedField) return;
        const keys = Array.isArray(payload.sessionKeys) ? payload.sessionKeys : [];
        globalSearchState.query = normalizedQuery;
        globalSearchState.field = normalizedField;
        globalSearchState.pending = false;
        globalSearchState.error = '';
        globalSearchState.matchKeys = new Set(keys.map(item => String(item || '')));
        renderWorkspaceList(true);
        renderViewer();
      } catch (error) {
        if (requestId !== globalSearchState.requestId) return;
        globalSearchState.pending = false;
        globalSearchState.error = error && error.message ? error.message : 'unknown error';
        globalSearchState.matchKeys = new Set();
        renderWorkspaceList(true);
        renderViewer();
      }
    }

    function loadSortPrefs() {
      try {
        const raw = localStorage.getItem(SORT_STORAGE_KEY);
        if (!raw) return;
        const prefs = JSON.parse(raw);
        if (Array.isArray(prefs.provider) && prefs.provider.length) filterState.provider = prefs.provider;
        else if (typeof prefs.provider === 'string' && prefs.provider) filterState.provider = [prefs.provider];
        if (Array.isArray(prefs.source) && prefs.source.length) filterState.source = prefs.source;
        else if (typeof prefs.source === 'string' && prefs.source) filterState.source = [prefs.source];
        if (prefs.workspaceField) workspaceSortField.value = prefs.workspaceField;
        if (prefs.workspaceDirection) workspaceSortDirection.value = prefs.workspaceDirection;
        if (prefs.sessionField) sessionSortField.value = prefs.sessionField;
        if (prefs.sessionDirection) sessionSortDirection.value = prefs.sessionDirection;
      } catch (error) {
        console.warn('无法读取排序偏好', error);
      }
    }

    function saveSortPrefs() {
      const prefs = {
        provider: filterState.provider,
        source: filterState.source,
        workspaceField: workspaceSortField.value,
        workspaceDirection: workspaceSortDirection.value,
        sessionField: sessionSortField.value,
        sessionDirection: sessionSortDirection.value
      };
      localStorage.setItem(SORT_STORAGE_KEY, JSON.stringify(prefs));
    }

    function collectUniqueSessionValues(field) {
      const values = new Set();
      if (!APP || !Array.isArray(APP.workspaces)) return [];
      APP.workspaces.forEach(workspace => {
        workspace.sessions.forEach(session => {
          const value = session[field];
          if (value) values.add(value);
        });
      });
      return Array.from(values).sort((a, b) => compareText(a, b));
    }

    function normalizeSelection(values) {
      if (!Array.isArray(values) || !values.length) return ['all'];
      if (values.includes('all')) return ['all'];
      return Array.from(new Set(values));
    }

    function renderChecklist(container, values, selectedValues, key) {
      const normalized = normalizeSelection(selectedValues);
      container.innerHTML = '';
      const allValues = ['all', ...values];
      allValues.forEach(value => {
        const label = document.createElement('label');
        label.className = 'check-item';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = normalized.includes(value);
        input.dataset.value = value;
        input.dataset.filterKey = key;
        const text = document.createElement('span');
        text.textContent = value;
        label.appendChild(input);
        label.appendChild(text);
        container.appendChild(label);
      });
    }

    function refreshFilterMenus() {
      renderChecklist(
        workspaceProviderFilter,
        collectUniqueSessionValues('modelProvider'),
        filterState.provider,
        'provider'
      );
      renderChecklist(
        workspaceSourceFilter,
        collectUniqueSessionValues('source'),
        filterState.source,
        'source'
      );
    }

    function toggleFilterValue(filterKey, value) {
      let next = [...(filterState[filterKey] || ['all'])];
      if (value === 'all') {
        next = ['all'];
      } else if (next.includes(value)) {
        next = next.filter(item => item !== value && item !== 'all');
      } else {
        next = next.filter(item => item !== 'all');
        next.push(value);
      }
      filterState[filterKey] = normalizeSelection(next);
      saveSortPrefs();
      refreshFilterMenus();
      renderWorkspaceList();
    }

    function matchMultiSelect(value, selectedValues) {
      const normalized = normalizeSelection(selectedValues);
      if (normalized.includes('all')) return true;
      return normalized.includes(value || '');
    }

    function compareText(a, b) {
      return String(a || '').localeCompare(String(b || ''), 'zh-CN', {
        numeric: true,
        sensitivity: 'base'
      });
    }

    function compareNumber(a, b) {
      return (Number(a) || 0) - (Number(b) || 0);
    }

    function compareDate(a, b) {
      return Date.parse(a || '') - Date.parse(b || '');
    }

    function applyDirection(value, direction) {
      return direction === 'desc' ? -value : value;
    }

    function sortWorkspaces(items) {
      const field = workspaceSortField.value;
      const direction = workspaceSortDirection.value;
      return [...items].sort((a, b) => {
        let result = 0;
        if (field === 'updated') {
          result = compareDate(a.workspace.latestUpdatedAt, b.workspace.latestUpdatedAt);
        } else if (field === 'count') {
          result = compareNumber(a.workspace.count, b.workspace.count);
        } else {
          result = compareText(a.workspace.cwd, b.workspace.cwd);
        }
        if (result === 0) result = compareText(a.workspace.cwd, b.workspace.cwd);
        return applyDirection(result, direction);
      });
    }

    function sortSessions(items) {
      const field = sessionSortField.value;
      const direction = sessionSortDirection.value;
      return [...items].sort((a, b) => {
        let result = 0;
        if (field === 'title') {
          result = compareText(a.title, b.title);
        } else if (field === 'messageCount') {
          result = compareNumber(a.messageCount, b.messageCount);
        } else {
          result = compareDate(a.updatedAt, b.updatedAt);
        }
        if (result === 0) result = compareDate(a.updatedAt, b.updatedAt);
        if (result === 0) result = compareText(a.title, b.title);
        return applyDirection(result, direction);
      });
    }

    loadSortPrefs();

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function truncateDisplayText(value, maxLength) {
      const text = String(value || '');
      const limit = Number(maxLength) > 0 ? Number(maxLength) : 300;
      if (text.length <= limit) return text;
      return text.slice(0, limit) + '...';
    }

    function groupSessionsByTitle(sessions) {
      const groups = new Map();
      (sessions || []).forEach(session => {
        const title = session.title || '(未命名标题)';
        if (!groups.has(title)) {
          groups.set(title, {
            title,
            sessions: [],
            latestUpdatedAt: '',
            latestUpdatedLocal: ''
          });
        }
        const group = groups.get(title);
        group.sessions.push(session);
        if (!group.latestUpdatedAt || compareDate(session.updatedAt, group.latestUpdatedAt) > 0) {
          group.latestUpdatedAt = session.updatedAt || '';
          group.latestUpdatedLocal = session.updatedLocal || '';
        }
      });

      return Array.from(groups.values()).sort((a, b) => {
        let result = compareDate(a.latestUpdatedAt, b.latestUpdatedAt);
        if (result === 0) result = compareText(a.title, b.title);
        return result * -1;
      });
    }

    function hasMultipleSessionBranches(group) {
      return !!(group && Array.isArray(group.sessions) && group.sessions.length > 1);
    }

    function readTitleGroupCollapseState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(TITLE_GROUP_COLLAPSE_STORAGE_KEY) || '{}');
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
      } catch (_) {
        return {};
      }
    }

    function getTitleGroupCollapseKey(workspace, group) {
      return JSON.stringify([
        String(getCurrentSourceId() || ''),
        String(workspace && workspace.cwd || ''),
        String(group && group.title || '')
      ]);
    }

    function isTitleGroupCollapsed(workspace, group) {
      if (!hasMultipleSessionBranches(group)) return false;
      const state = readTitleGroupCollapseState();
      return state[getTitleGroupCollapseKey(workspace, group)] === true;
    }

    function setTitleGroupCollapsed(workspace, group, collapsed) {
      if (!hasMultipleSessionBranches(group)) return;
      const state = readTitleGroupCollapseState();
      const key = getTitleGroupCollapseKey(workspace, group);
      if (collapsed) state[key] = true;
      else delete state[key];
      try {
        localStorage.setItem(TITLE_GROUP_COLLAPSE_STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function formatSessionMeta(session) {
      if (!session) return '';
      const parts = [];
      if (session.updatedLocal) parts.push(session.updatedLocal);
      parts.push('用户 ' + (session.userCount || 0));
      parts.push('回答 ' + (session.assistantCount || 0));
      if (session.archived) parts.push('归档');
      if (session.hasImageReference) parts.push('含图片');
      return parts.join(' · ');
    }

    function formatTitleGroupMeta(group) {
      if (!group) return '';
      if (!hasMultipleSessionBranches(group)) {
        return formatSessionMeta(group.sessions && group.sessions[0]);
      }
      const parts = ['分支 ' + group.sessions.length];
      if (group.latestUpdatedLocal) parts.push('最新 ' + group.latestUpdatedLocal);
      return parts.join(' · ');
    }

    function getVisibleWorkspaces() {
      if (!APP || !Array.isArray(APP.workspaces)) return [];
      const workspaceQuery = workspaceFilterInput.value.trim().toLowerCase();
      const sessionQuery = sessionFilterInput.value.trim().toLowerCase();
      const providerValues = filterState.provider;
      const sourceValues = filterState.source;

      const visible = APP.workspaces.map(workspace => {
        const workspaceMatch = !workspaceQuery || workspace._search.includes(workspaceQuery);
        const filteredSessions = workspace.sessions.filter(session => {
          const sessionMatch = !sessionQuery || session._search.includes(sessionQuery);
          const providerMatch = matchMultiSelect(session.modelProvider, providerValues);
          const sourceMatch = matchMultiSelect(session.source, sourceValues);
          const globalSearchMatch = sessionMatchesGlobalSearch(session);
          return sessionMatch && providerMatch && sourceMatch && globalSearchMatch;
        });

        if (!workspaceMatch || !filteredSessions.length) {
          return null;
        }

        return {
          workspace,
          sessions: sortSessions(filteredSessions)
        };
      }).filter(Boolean);

      return sortWorkspaces(visible);
    }

    function getSessionKey(session) {
      return session && (session.key || session.path || session.id || '');
    }

    function stableHash(value) {
      const text = String(value || '');
      let hash = 2166136261;
      for (let index = 0; index < text.length; index++) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16).padStart(8, '0');
    }

    function createGroupNoteTarget(workspace, group) {
      const cwd = (workspace && workspace.cwd) || '';
      const title = (group && group.title) || '';
      const sourceId = typeof getCurrentSourceId === 'function' ? getCurrentSourceId() : 'local-codex';
      return {
        key: 'group:' + sourceId + ':' + stableHash(cwd) + ':' + stableHash(title),
        type: 'group',
        sourceId,
        workspace: cwd,
        title,
        path: '',
        sessionId: '',
        context: title
      };
    }

    function createSessionNoteTarget(workspace, group, session) {
      const identity = (session && (session.path || session.key || session.id)) || '';
      const sourceId = typeof getCurrentSourceId === 'function' ? getCurrentSourceId() : 'local-codex';
      return {
        key: 'session:' + sourceId + ':' + stableHash(identity),
        type: 'session',
        sourceId,
        workspace: (workspace && workspace.cwd) || '',
        title: (group && group.title) || (session && session.title) || '',
        path: (session && session.path) || '',
        sessionId: (session && session.id) || '',
        context: (session && (session.path || session.title || session.id)) || ''
      };
    }

    function getNote(key) {
      return notesState.notes.get(String(key || '')) || null;
    }

    function applyNoteMetadata(element, target, fallbackTitle) {
      if (!element || !target) return;
      const note = getNote(target.key);
      element.dataset.noteKey = target.key || '';
      element.dataset.noteType = target.type || '';
      element.dataset.noteWorkspace = target.workspace || '';
      element.dataset.noteTitle = target.title || '';
      element.dataset.notePath = target.path || '';
      element.dataset.noteSessionId = target.sessionId || '';
      element.dataset.noteContext = target.context || fallbackTitle || '';
      if (note && note.note) {
        element.removeAttribute('title');
        element.dataset.noteText = note.note;
        element.classList.toggle('has-note', true);
      } else {
        element.setAttribute('title', fallbackTitle || '');
        delete element.dataset.noteText;
        element.classList.toggle('has-note', false);
      }
    }

    async function loadNotes() {
      try {
        const response = await fetch(NOTES_API_URL + '?sourceId=' + encodeURIComponent(getCurrentSourceId()), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const payload = await response.json();
        const notes = payload && payload.notes && typeof payload.notes === 'object' ? payload.notes : {};
        notesState.notes = new Map(Object.entries(notes));
        notesState.loaded = true;
        notesState.available = true;
      } catch (error) {
        notesState.notes = new Map();
        notesState.loaded = true;
        notesState.available = false;
        console.warn('备注读取失败', error);
      }
    }

    function noteTargetFromElement(element) {
      if (!element || !element.dataset || !element.dataset.noteKey) return null;
      return {
        key: element.dataset.noteKey || '',
        type: element.dataset.noteType || '',
        sourceId: getCurrentSourceId(),
        workspace: element.dataset.noteWorkspace || '',
        title: element.dataset.noteTitle || '',
        path: element.dataset.notePath || '',
        sessionId: element.dataset.noteSessionId || '',
        context: element.dataset.noteContext || ''
      };
    }

    function closeNoteMenu() {
      if (noteContextMenu) {
        noteContextMenu.hidden = true;
        noteContextMenu.innerHTML = '';
      }
      activeNoteTarget = null;
    }

    const PANE_COLLAPSE_STORAGE_KEYS = {
      workspaces: 'Yuji.sidebarCollapsed.workspaces',
      titles: 'Yuji.sidebarCollapsed.titles'
    };

    function readBooleanStorage(key) {
      try {
        return localStorage.getItem(key) === 'true';
      } catch (error) {
        return false;
      }
    }

    function getStoredPaneCollapseState() {
      return {
        workspaces: readBooleanStorage(PANE_COLLAPSE_STORAGE_KEYS.workspaces),
        titles: readBooleanStorage(PANE_COLLAPSE_STORAGE_KEYS.titles)
      };
    }

    let paneCollapseState = getStoredPaneCollapseState();
    syncPaneCollapseState();

    function setSidebarCollapsedState(nextState, options) {
      const settings = Object.assign({ persist: true, preserveScroll: false }, options || {});
      const savedScrollTop = settings.preserveScroll && typeof transcript !== 'undefined' && transcript
        ? transcript.scrollTop
        : null;
      paneCollapseState = {
        workspaces: !!nextState.workspaces,
        titles: !!nextState.titles
      };
      if (settings.persist) {
        try {
          localStorage.setItem(PANE_COLLAPSE_STORAGE_KEYS.workspaces, paneCollapseState.workspaces ? 'true' : 'false');
          localStorage.setItem(PANE_COLLAPSE_STORAGE_KEYS.titles, paneCollapseState.titles ? 'true' : 'false');
        } catch (error) {
        }
      }
      syncPaneCollapseState();
      if (savedScrollTop !== null && typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(() => {
          if (typeof transcript !== 'undefined' && transcript) transcript.scrollTop = savedScrollTop;
        });
      }
    }

    function setPaneCollapsed(pane, collapsed) {
      if (pane !== 'workspaces' && pane !== 'titles') return;
      const nextState = Object.assign({}, paneCollapseState);
      nextState[pane] = !!collapsed;
      setSidebarCollapsedState(nextState);
    }

    function toggleAllSidebars() {
      const allCollapsed = !!paneCollapseState.workspaces && !!paneCollapseState.titles;
      setSidebarCollapsedState({
        workspaces: !allCollapsed,
        titles: !allCollapsed
      }, { preserveScroll: true });
    }

    function syncPaneCollapseState() {
      const workspaceCollapsed = !!paneCollapseState.workspaces;
      const sessionCollapsed = !!paneCollapseState.titles;
      const allCollapsed = workspaceCollapsed && sessionCollapsed;
      if (typeof appShell !== 'undefined' && appShell) {
        appShell.classList.toggle('is-workspace-collapsed', workspaceCollapsed);
        appShell.classList.toggle('is-session-collapsed', sessionCollapsed);
      }
      if (typeof workspacePane !== 'undefined' && workspacePane) workspacePane.classList.toggle('is-collapsed', workspaceCollapsed);
      if (typeof sessionPane !== 'undefined' && sessionPane) sessionPane.classList.toggle('is-collapsed', sessionCollapsed);
      if (typeof collapseButtons !== 'undefined') {
        if (collapseButtons.workspaces) collapseButtons.workspaces.hidden = workspaceCollapsed;
        if (collapseButtons.titles) collapseButtons.titles.hidden = sessionCollapsed;
      }
      if (typeof expandButtons !== 'undefined') {
        if (expandButtons.workspaces) expandButtons.workspaces.hidden = !workspaceCollapsed;
        if (expandButtons.titles) expandButtons.titles.hidden = !sessionCollapsed;
      }
      if (typeof collapsedControls !== 'undefined' && collapsedControls) collapsedControls.hidden = !(workspaceCollapsed || sessionCollapsed);
      if (typeof globalSidebarToggleButton !== 'undefined' && globalSidebarToggleButton) {
        const label = allCollapsed ? '展开' : '收起';
        const title = allCollapsed ? '一键展开目录和标题' : '一键收起目录和标题';
        globalSidebarToggleButton.textContent = label;
        globalSidebarToggleButton.title = title;
        globalSidebarToggleButton.setAttribute('aria-label', title);
      }
    }

    function positionFloatingPanel(panel, x, y) {
      if (!panel) return;
      panel.hidden = false;
      panel.style.left = '0px';
      panel.style.top = '0px';
      const rect = panel.getBoundingClientRect();
      const margin = 10;
      let left = x + 10;
      let top = y + 10;
      if (left + rect.width + margin > window.innerWidth) {
        left = Math.max(margin, x - rect.width - 10);
      }
      if (top + rect.height + margin > window.innerHeight) {
        top = Math.max(margin, y - rect.height - 10);
      }
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
    }

    function openNoteMenu(event, target) {
      if (!noteContextMenu || !target) return;
      if (!getSourceCapability('canEditNotes')) {
        showToast('云端备注只能在来源设备编辑。', { duration: 2200 });
        return;
      }
      closeNoteMenu();
      hideNoteTooltip();
      activeNoteTarget = target;
      const hasNote = !!getNote(target.key);
      const actions = hasNote
        ? [
            ['edit', '编辑备注'],
            ['delete', '删除备注']
          ]
        : [
            ['new', '新建备注']
          ];
      noteContextMenu.innerHTML = actions.map(action => '<button type="button" data-note-action="' + action[0] + '">' + action[1] + '</button>').join('');
      positionFloatingPanel(noteContextMenu, event.clientX || 0, event.clientY || 0);
    }

    function closeNoteModal() {
      if (!noteModal) return;
      noteModal.hidden = true;
      if (noteError) noteError.textContent = '';
      activeNoteTarget = null;
    }

    function openNoteModal(target) {
      if (!noteModal || !noteInput || !target) return;
      if (!getSourceCapability('canEditNotes')) return;
      if (typeof closeSearchHistoryMenu === 'function') closeSearchHistoryMenu();
      activeNoteTarget = target;
      const existing = getNote(target.key);
      noteModalTitle.textContent = existing ? '编辑备注' : '新建备注';
      noteContextText.textContent = target.context || target.title || target.path || target.key;
      noteInput.value = existing && existing.note ? existing.note : '';
      if (noteError) noteError.textContent = '';
      noteModal.hidden = false;
      requestAnimationFrame(() => noteInput.focus());
    }

    async function saveActiveNote() {
      if (!activeNoteTarget || !noteInput) return;
      const note = String(noteInput.value || '').trim();
      if (!note) {
        if (noteError) noteError.textContent = '备注不能为空；如果不需要备注，请使用删除备注。';
        return;
      }
      if (note.length > MAX_NOTE_LENGTH) {
        if (noteError) noteError.textContent = '备注太长，最多 ' + MAX_NOTE_LENGTH + ' 字。';
        return;
      }
      try {
        const response = await mutationFetch(NOTES_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({}, activeNoteTarget, { sourceId: getCurrentSourceId(), note }))
        });
        const payload = await response.json().catch(() => ({}));

    function updateStats() {

    function collectSessionMap(data) {
      const map = new Map();
      ((data && data.workspaces) || []).forEach(workspace => {
        workspace.sessions.forEach(session => {
          map.set(getSessionKey(session), {
            workspace: workspace.cwd,
            session,
            signature: sessionSignature(session)
          });
        });
      });
      return map;
    }

    function sessionSignature(session) {
      return [
        session.updatedLocal || '',
        session.userCount || 0,
        session.assistantCount || 0,
        session.detailHref || ''
      ].join('|');
    }

    function flattenSessions(data) {
      const sessions = [];
      ((data && data.workspaces) || []).forEach(workspace => {
        workspace.sessions.forEach(session => {
          sessions.push({ workspace: workspace.cwd, session });
        });
      });
      return sessions;
    }

    function collectWorkspaceSet(data) {
      return new Set(((data && data.workspaces) || []).map(workspace => workspace.cwd || '(未知工作目录)'));
    }

    function countUniqueWorkspaces(items) {
      return new Set(items.map(item => item.workspace || '(未知工作目录)')).size;
    }

    function groupChangesByWorkspace(items) {
      const buckets = new Map();
      items.forEach(item => {
        const key = item.workspace || '(未知工作目录)';
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(item);
      });

      const rows = Array.from(buckets.entries()).map(([workspace, changes]) => ({
        workspace,
        changes
      }));

      rows.sort((a, b) => {
        if (b.changes.length !== a.changes.length) return b.changes.length - a.changes.length;
        return a.workspace.localeCompare(b.workspace, 'zh-CN');
      });

      return rows;
    }

    function formatGroupedChangeMessage(title, items, mapper) {
      if (!items.length) return '';
      const groups = groupChangesByWorkspace(items);
      const lines = [title + ' ' + items.length + ' 条：', ''];

      groups.slice(0, 8).forEach(group => {
        lines.push('【' + group.workspace + '】');
        group.changes.slice(0, 4).forEach(change => {
          lines.push(mapper(change));
        });
        if (group.changes.length > 4) {
          lines.push('  其余 ' + (group.changes.length - 4) + ' 条未展开');
        }
        lines.push('');
      });

      if (groups.length > 8) {
        lines.push('其余 ' + (groups.length - 8) + ' 个工作目录未在弹窗中展开。');
      }

      return lines.join('\n').trim();
    }

    function setRefreshButtonLoading(button, isLoading, loadingText, idleText) {
      if (!button) return;

      button.textContent = isLoading ? loadingText : idleText;
      if (button.classList) {

    function formatRefreshSummary(mode, payload, added, updated) {
      const label = mode === 'current' ? '快刷' : (mode === 'rebuild' ? '全量重建' : '刷新');
      const parts = [];
      const notice = String(payload.notice || '').trim();
      const parsed = Number(payload.parsedCount || 0);
      const reused = Number(payload.reusedCount || 0);
      const scanned = Number(payload.scannedCount || 0);
      const elapsedMs = Number(payload.elapsedMs || 0);
      const elapsedText = elapsedMs ? '，用时 ' + (elapsedMs / 1000).toFixed(1) + ' 秒' : '';
      if (notice) parts.push(notice);
      parts.push(label + '完成：扫描 ' + scanned + ' 条，解析 ' + parsed + ' 条，复用 ' + reused + ' 条' + elapsedText + '。');
      if (added.length) parts.push('新增聊天记录 ' + added.length + ' 条。');
      if (updated.length) parts.push('已有聊天更新 ' + updated.length + ' 条。');
      if (!added.length && !updated.length) parts.push('没有发现新增或变化的聊天记录。');
      return parts.join('\n');
    }

    function buildSelectedSessionRequestBody() {
      const session = getSelectedSession();
      return session && session.path ? { path: session.path } : null;
    }

    function bodyWithSourceId(body) {
      const sourceId = typeof getCurrentSourceId === 'function' ? getCurrentSourceId() : 'local-codex';
      return Object.assign({}, body || {}, { sourceId });
    }

    async function runRefreshRequest(mode, options) {
      const settings = Object.assign({
        endpoint: '/api/refresh',
        buttonId: 'refreshButton',
        idleText: '刷新',
        loadingText: '刷新中...',
        body: null,
        preNotice: ''
      }, options || {});
      if (runRefreshRequest._running) return;
      runRefreshRequest._running = true;
      const button = typeof document !== 'undefined' ? document.getElementById(settings.buttonId) : null;
      if (settings.preNotice) {
        showToast(settings.preNotice, { duration: 1800 });
      }
      setRefreshButtonLoading(button, true, settings.loadingText, settings.idleText);
      try {
        const currentApp = APP && Array.isArray(APP.workspaces) ? APP : { workspaces: [] };
        const beforeMap = collectSessionMap(currentApp);
        const beforeWorkspaceSet = collectWorkspaceSet(currentApp);
        const previousWorkspaceId = selectedWorkspaceId;
        const previousSessionKey = selectedSessionKey;
        const refreshAnchor = typeof captureProgressAnchor === 'function' ? captureProgressAnchor(getSelectedSession()) : null;
        if (refreshAnchor && typeof saveProgressAnchor === 'function') saveProgressAnchor(refreshAnchor);
        const refreshRestoreToken = typeof progressRestoreToken !== 'undefined' ? ++progressRestoreToken : 0;
        const previousWorkspace = currentApp.workspaces.find(workspace => workspace.id === previousWorkspaceId);
        const previousWorkspacePath = previousWorkspace ? previousWorkspace.cwd : '';
        const request = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyWithSourceId(settings.body))
        };
        const requestFetch = typeof mutationFetch === 'function' ? mutationFetch : fetch;
        const response = await requestFetch(settings.endpoint, request);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const payload = await response.json();
        if (!payload.ok) throw new Error(payload.error || 'refresh failed');
        if (typeof clearFailedMessageImageCache === 'function') clearFailedMessageImageCache();

        APP = payload.data;
        if (!APP || typeof APP !== 'object') APP = { workspaces: [] };
        if (!Array.isArray(APP.workspaces)) APP.workspaces = [];
        const refreshedSourceId = (APP.source && APP.source.id) || (typeof getCurrentSourceId === 'function' ? getCurrentSourceId() : 'local-codex');
        if (typeof currentSourceId !== 'undefined') currentSourceId = refreshedSourceId;
        if (typeof sourceState !== 'undefined' && sourceState) sourceState.selectedSourceId = refreshedSourceId;
        if (typeof renderSourceSelect === 'function') renderSourceSelect();
        prepareData();
        if (typeof getGlobalSearchQuery === 'function' && typeof runGlobalSearch === 'function' && getGlobalSearchQuery()) {
          await runGlobalSearch(getGlobalSearchQuery(), getGlobalSearchField());
        }
        updateStats();
        refreshFilterMenus();
        sessionCache.clear();
        CURRENT_DETAIL = null;

        const flattened = flattenSessions(APP);
        const afterWorkspaceSet = collectWorkspaceSet(APP);
        const added = flattened.filter(item => !beforeMap.has(getSessionKey(item.session)));
        const updated = flattened.filter(item => {
          const before = beforeMap.get(getSessionKey(item.session));
          return before && before.signature !== sessionSignature(item.session);
        });
        const nextWorkspace = APP.workspaces.find(workspace => workspace.cwd === previousWorkspacePath);
        const previousSession = nextWorkspace && nextWorkspace.sessions.find(session => getSessionKey(session) === previousSessionKey);
        selectedWorkspaceId = nextWorkspace ? nextWorkspace.id : (APP.workspaces[0] ? APP.workspaces[0].id : null);
        selectedSessionKey = previousSession ? previousSessionKey : (APP.workspaces[0] && APP.workspaces[0].sessions[0] ? APP.workspaces[0].sessions[0].key : null);
        if (!previousSession) {
          selectedQuestionKey = null;
          selectedQuestionKeyIsTemporary = false;
        }
        renderWorkspaceList(true);

        const selectedAfterRefresh = getSelectedSession();
        if (selectedAfterRefresh) {
          try {
            const detail = payload.currentDetail && detailMatchesSession(selectedAfterRefresh, payload.currentDetail)
              ? payload.currentDetail
              : await loadSessionDetail(selectedAfterRefresh);
            if (applyLoadedDetail(selectedAfterRefresh, detail)) {
              renderViewer();
              if (refreshAnchor && typeof restoreProgressAnchor === 'function' && selectedAfterRefresh && getSessionKey(selectedAfterRefresh) === refreshAnchor.sessionKey) {
                restoreProgressAnchor(refreshAnchor, { token: refreshRestoreToken, behavior: 'auto' });
              } else {
                requestAnimationFrame(() => focusTranscriptForQuestionNavigation());
              }
            }
          } catch (detailError) {
            console.warn('刷新后加载会话详情失败', detailError);
          }
        }

        const message = formatRefreshSummary(mode, payload, added, updated);
        showToast(message, { duration: 3200 });
      } catch (error) {
        showToast('刷新失败：' + (error.message || '未知错误') + '\n请确认页面是通过 Open-CodexChatIndex.cmd 打开的。', { tone: 'error', duration: 3600 });
      } finally {
        setRefreshButtonLoading(button, false, settings.loadingText, settings.idleText);
        runRefreshRequest._running = false;
        if (typeof checkCurrentSourceStatus === 'function') void checkCurrentSourceStatus(true);
      }
    }

    async function refreshIndex() {
