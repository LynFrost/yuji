    function focusTranscriptForQuestionNavigation() {
      if (!selectedQuestionKey || !transcript || typeof transcript.focus !== 'function') return false;
      transcript.focus({ preventScroll: true });
      return true;
    }

    function scrollPaneTop(id) {
      const el = document.getElementById(id);
      if (el) el.scrollTo({ top: 0, behavior: 'smooth' });
      if (id === 'transcript') {
        scrollTranscriptTop();
      }
    }

    function scrollTranscriptTop() {
      if (focusFirstQuestion({ scroll: false })) {
        focusTranscriptForQuestionNavigation();
      }
      if (!transcript || typeof transcript.scrollTo !== 'function') return;
      cancelQuestionScrollAnimation();
      const token = ++activeQuestionScrollToken;
      lockTranscriptLayoutForProgrammaticScroll();
      let stableFrames = 0;
      let attempts = 0;
      const minAttempts = 8;
      const maxAttempts = 36;
      const settleUnlockedTop = () => {
        let unlockedStableFrames = 0;
        let unlockedAttempts = 0;
        const minUnlockedAttempts = 6;
        const maxUnlockedAttempts = 24;
        const settle = () => {
          if (token !== activeQuestionScrollToken) return;
          transcript.scrollTo({ top: 0, behavior: 'auto' });
          unlockedStableFrames = (transcript.scrollTop || 0) <= 2 ? unlockedStableFrames + 1 : 0;
          unlockedAttempts++;
          if ((unlockedAttempts >= minUnlockedAttempts && unlockedStableFrames >= 3) || unlockedAttempts >= maxUnlockedAttempts) {
            return;
          }
          requestAnimationFrame(settle);
        };
        requestAnimationFrame(settle);
      };
      const followTop = () => {
        if (token !== activeQuestionScrollToken) return;
        transcript.scrollTo({ top: 0, behavior: 'auto' });
        stableFrames = (transcript.scrollTop || 0) <= 2 ? stableFrames + 1 : 0;
        attempts++;
        if ((attempts >= minAttempts && stableFrames >= 3) || attempts >= maxAttempts) {
          unlockTranscriptLayoutForProgrammaticScroll();
          settleUnlockedTop();
          return;
        }
        requestAnimationFrame(followTop);
      };
      requestAnimationFrame(followTop);
    }

    function scrollTranscriptBottom() {
      if (focusLastQuestion({ scroll: false })) {
        focusTranscriptForQuestionNavigation();
      }
      if (!transcript || typeof transcript.scrollTo !== 'function') return;
      cancelQuestionScrollAnimation();
      const token = ++activeQuestionScrollToken;
      lockTranscriptLayoutForProgrammaticScroll();
      let stableFrames = 0;
      let attempts = 0;
      const minAttempts = 12;
      const maxAttempts = 48;
      const settleUnlockedBottom = () => {
        let unlockedStableFrames = 0;
        let unlockedAttempts = 0;
        const minUnlockedAttempts = 8;
        const maxUnlockedAttempts = 36;
        const settle = () => {
          if (token !== activeQuestionScrollToken) return;
          const bottomTop = Math.max(0, transcript.scrollHeight);
          transcript.scrollTo({ top: bottomTop, behavior: 'auto' });
          const bottomGap = Math.max(0, transcript.scrollHeight - transcript.clientHeight - transcript.scrollTop);
          unlockedStableFrames = bottomGap <= 2 ? unlockedStableFrames + 1 : 0;
          unlockedAttempts++;
          if ((unlockedAttempts >= minUnlockedAttempts && unlockedStableFrames >= 4) || unlockedAttempts >= maxUnlockedAttempts) {
            return;
          }
          requestAnimationFrame(settle);
        };
        requestAnimationFrame(settle);
      };
      const followBottom = () => {
        if (token !== activeQuestionScrollToken) return;
        const bottomTop = Math.max(0, transcript.scrollHeight);
        transcript.scrollTo({ top: bottomTop, behavior: 'auto' });
        const bottomGap = Math.max(0, transcript.scrollHeight - transcript.clientHeight - transcript.scrollTop);
        stableFrames = bottomGap <= 2 ? stableFrames + 1 : 0;
        attempts++;
        if ((attempts >= minAttempts && stableFrames >= 4) || attempts >= maxAttempts) {
          unlockTranscriptLayoutForProgrammaticScroll();
          settleUnlockedBottom();
          return;
        }
        requestAnimationFrame(followBottom);
      };
      requestAnimationFrame(followBottom);
    }

    function ensureSelection() {
      const visible = getVisibleWorkspaces();
      if (!visible.length) {
        return;
      }

      const workspaceVisible = visible.find(item => item.workspace.id === selectedWorkspaceId);
      if (!workspaceVisible) {
        if (hasLibrarySearchQuery()) {
          return;
        }
        selectedWorkspaceId = visible[0].workspace.id;
      }

      const currentWorkspace = visible.find(item => item.workspace.id === selectedWorkspaceId) || visible[0];
      if (!currentWorkspace.sessions.length) {
        return;
      }

      const sessionVisible = currentWorkspace.sessions.find(item => getSessionKey(item) === selectedSessionKey);
      if (!sessionVisible) {
        if (hasLibrarySearchQuery()) {
          return;
        }
        selectedSessionKey = currentWorkspace.sessions[0].key;
      }
    }

    function isDetailLoadedForSession(session) {
      if (!session || !CURRENT_DETAIL) return false;
      if (CURRENT_DETAIL.path && session.path) return CURRENT_DETAIL.path === session.path;
      if (CURRENT_DETAIL.id && session.id) return CURRENT_DETAIL.id === session.id;
      return false;
    }

    function detailMatchesSession(session, detail) {
      if (!session || !detail) return false;
      if (detail.path && session.path) return detail.path === session.path;
      if (detail.id && session.id) return detail.id === session.id;
      return false;
    }

    function applyLoadedDetail(session, detail) {
      if (!detailMatchesSession(session, detail)) return false;
      if (getSessionKey(session) !== selectedSessionKey) return false;
      cacheCurrentDetail(getSessionKey(session), detail);
      return true;
    }

    function getCurrentDetailEvents() {
      if (!CURRENT_DETAIL || !Array.isArray(CURRENT_DETAIL.events)) return [];
      return CURRENT_DETAIL.events.filter(event => {
        return event && ['user', 'assistant_commentary', 'assistant_final', 'tool', 'system'].includes(event.kind);
      });
    }

    function getQuestionKey(session, eventIndex) {
      return getSessionKey(session) + '::question::' + String(eventIndex);
    }

    function getWorkspaceForSession(session) {
      if (!APP || !Array.isArray(APP.workspaces)) return null;
      if (!session && selectedWorkspaceId) {
        return APP.workspaces.find(workspace => workspace.id === selectedWorkspaceId) || null;
      }
      const sessionKey = getSessionKey(session);
      return APP.workspaces.find(workspace => {
        return workspace && Array.isArray(workspace.sessions) && workspace.sessions.some(item => getSessionKey(item) === sessionKey);
      }) || null;
    }

    function getProgressAnchorMapKey(sourceId, sessionKey, workspacePath) {
      return [sourceId || '', workspacePath || '', sessionKey || ''].join('::');
    }

    function getProgressAnchorKeyForSession(session) {
      if (!session) return '';
      const workspace = getWorkspaceForSession(session);
      return getProgressAnchorMapKey(getCurrentSourceId(), getSessionKey(session), workspace ? (workspace.cwd || '') : '');
    }

    function normalizeQuestionText(value) {
      return String(value || '').replace(/\s+/g, ' ').trim().slice(0, 120);
    }

    function hashQuestionText(value) {
      const text = normalizeQuestionText(value);
      let hash = 0x811c9dc5;
      for (let index = 0; index < text.length; index++) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 0x01000193);
      }
      return (hash >>> 0).toString(16).padStart(8, '0').slice(0, 8);
    }

    function getQuestionOffsetFromTranscript(questionKey) {
      if (!questionKey || !transcript || typeof transcript.getBoundingClientRect !== 'function') return 0;
      const element = findQuestionElement(questionKey);
      if (!element || typeof element.getBoundingClientRect !== 'function') return 0;
      const transcriptRect = transcript.getBoundingClientRect();
      const elementRect = element.getBoundingClientRect();
      return Math.round(elementRect.top - transcriptRect.top);
    }

    function saveProgressAnchor(anchor) {
      if (!anchor || !anchor.sourceId || !anchor.sessionKey || !anchor.questionKey) return false;
      const key = getProgressAnchorMapKey(anchor.sourceId, anchor.sessionKey, anchor.workspacePath || '');
      sessionProgressAnchors.delete(key);
      sessionProgressAnchors.set(key, anchor);
      while (sessionProgressAnchors.size > MAX_PROGRESS_ANCHORS) {
        const oldestKey = sessionProgressAnchors.keys().next().value;
        sessionProgressAnchors.delete(oldestKey);
      }
      return true;
    }

    function getProgressAnchorForSession(session) {
      const key = getProgressAnchorKeyForSession(session);
      return key ? (sessionProgressAnchors.get(key) || null) : null;
    }

    function captureProgressAnchor(session) {
      const targetSession = session || getSelectedSession();
      if (!targetSession || !selectedQuestionKey || selectedQuestionKeyIsTemporary) return null;
      const questions = getQuestionEvents();
      const questionIndex = questions.findIndex(event => event.questionKey === selectedQuestionKey);
      if (questionIndex < 0) return null;
      const question = questions[questionIndex];
      const workspace = getWorkspaceForSession(targetSession);
      return {
        sourceId: getCurrentSourceId(),
        workspacePath: workspace ? (workspace.cwd || '') : '',
        sessionKey: getSessionKey(targetSession),
        questionKey: question.questionKey,
        questionIndex,
        questionTextHash: question.questionTextHash || hashQuestionText(question.rawText || question.summary || ''),
        offsetFromQuestionTop: getQuestionOffsetFromTranscript(question.questionKey),
        viewMode: viewerViewMode,
        searchScope: viewerSearchScope,
        searchQuery: viewerSearchQuery,
        capturedAt: Date.now()
      };
    }

    function saveProgressAnchorForCurrentSession() {
      const anchor = captureProgressAnchor(getSelectedSession());
      if (!anchor) return false;
      const saved = saveProgressAnchor(anchor);
      if (saved) progressRestoreToken++;
      return saved;
    }

    function anchorMatchesCurrentSession(anchor, session) {
      const targetSession = session || getSelectedSession();
      if (!anchor || !targetSession) return false;
      if (anchor.sourceId !== getCurrentSourceId()) return false;
      if (anchor.sessionKey !== getSessionKey(targetSession)) return false;
      const workspace = getWorkspaceForSession(targetSession);
      if (anchor.workspacePath && workspace && workspace.cwd && anchor.workspacePath !== workspace.cwd) return false;
      return true;
    }

    function resolveQuestionKeyFromAnchor(anchor, session) {
      const targetSession = session || getSelectedSession();
      if (!anchorMatchesCurrentSession(anchor, targetSession)) return null;
      const questions = getQuestionEvents();
      if (!questions.length) return null;

      if (anchor.questionKey && questions.some(event => event.questionKey === anchor.questionKey)) {
        return anchor.questionKey;
      }

      if (anchor.questionTextHash) {
        const hashMatch = questions.find(event => event.questionTextHash === anchor.questionTextHash);
        if (hashMatch) return hashMatch.questionKey;
      }

      const index = Number(anchor.questionIndex);
      if (Number.isFinite(index) && index >= 0) {
        if (index < questions.length) return questions[index].questionKey;
        const previousIndex = Math.min(questions.length - 1, Math.floor(index));
        if (previousIndex >= 0 && questions[previousIndex]) return questions[previousIndex].questionKey;
        const nextQuestion = questions.find(Boolean);
        if (nextQuestion) return nextQuestion.questionKey;
      }

      return null;
    }

    function restoreProgressAnchor(anchor, options) {
      const settings = Object.assign({ behavior: 'auto', focusOnComplete: true }, options || {});
      if (settings.token && settings.token !== progressRestoreToken) return false;
      if (!anchorMatchesCurrentSession(anchor, getSelectedSession())) return false;
      const resolvedKey = resolveQuestionKeyFromAnchor(anchor, getSelectedSession());
      if (!resolvedKey) return false;
      setSelectedQuestionKey(resolvedKey, { scroll: false, persistAnchor: false });
      let attempts = 0;
      let stableFrames = 0;
      const maxAttempts = 8;
      const scroll = () => {
        if (settings.token && settings.token !== progressRestoreToken) return;
        if (!anchorMatchesCurrentSession(anchor, getSelectedSession())) return;
        const scrolled = scrollToQuestion(resolvedKey, settings.behavior || 'auto');
        attempts++;
        const element = findQuestionElement(resolvedKey);
        let settled = !!scrolled && !element;
        if (scrolled && element && transcript && typeof element.getBoundingClientRect === 'function' && typeof transcript.getBoundingClientRect === 'function') {
          const elementTop = element.getBoundingClientRect().top - transcript.getBoundingClientRect().top;
          stableFrames = Math.abs(elementTop - 16) <= 4 ? stableFrames + 1 : 0;
          settled = stableFrames >= 2;
        } else if (scrolled && element) {
          settled = true;
        }
        if (settled || attempts >= maxAttempts || typeof requestAnimationFrame !== 'function') {
          if (settings.focusOnComplete !== false) focusTranscriptForQuestionNavigation();
          return;
        }
        requestAnimationFrame(scroll);
      };
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(scroll);
      else scroll();
      return true;
    }

    function restoreCurrentProgressAnchorIfReadable(options) {
      if (viewerSearchQuery.trim()) return false;
      const anchor = getProgressAnchorForSession(getSelectedSession());
      if (!anchor) return false;
      const settings = Object.assign({ focusOnComplete: true }, options || {});
      return restoreProgressAnchor(anchor, {

    function getCurrentDetailEventsWithKeys() {

    function getQuestionEvents() {
      return getCurrentDetailEventsWithKeys().filter(event => event && event.kind === 'user').map((event, questionIndex) => {

    function syncSelectedQuestionKey(preferredPosition, options) {
      const settings = options || {};
      const questions = getQuestionEvents();
      if (!questions.length) {
        selectedQuestionKey = null;
        selectedQuestionKeyIsTemporary = false;
        return questions;
      }

      if (preferredPosition === 'last') {
        selectedQuestionKey = questions[questions.length - 1].questionKey;
        selectedQuestionKeyIsTemporary = false;
      } else if (preferredPosition === 'first') {
        selectedQuestionKey = questions[0].questionKey;
        selectedQuestionKeyIsTemporary = false;
      } else if (!selectedQuestionKey || !questions.some(event => event.questionKey === selectedQuestionKey)) {
        const anchor = settings.useProgressAnchor ? getProgressAnchorForSession(getSelectedSession()) : null;
        const restoredKey = anchor ? resolveQuestionKeyFromAnchor(anchor, getSelectedSession()) : null;
        selectedQuestionKey = restoredKey || (settings.allowFallbackFirst === false ? null : questions[0].questionKey);
        selectedQuestionKeyIsTemporary = !restoredKey && settings.temporaryFallback === true;
      } else if (!settings.keepTemporary) {

    function eventMatchesView(event) {
      if (viewerViewMode === 'questions') return event.kind === 'user';

    function getSearchTerms(query) {
      return String(query || '')
        .trim()
        .toLowerCase()
        .split(/\s+/)
        .filter(Boolean);
    }

    function eventMatchesSearch(event, query) {
      const terms = getSearchTerms(query);
      if (!terms.length) return true;
      const haystack = [event.summary, event.rawText, event.toolName, event.status].join(' ').toLowerCase();
      return terms.every(term => haystack.includes(term));
    }

    function questionMatchesSearch(event, query) {
      if (!event || event.kind !== 'user') return false;
      const terms = getSearchTerms(query);
      if (!terms.length) return true;
      const haystack = String(event.rawText || event.summary || '').toLowerCase();
      return terms.every(term => haystack.includes(term));
    }

    function highlightMatchesInElement(root, terms) {
      const activeTerms = Array.from(new Set((terms || []).filter(Boolean)));
      if (!root || !activeTerms.length || typeof document === 'undefined' || typeof NodeFilter === 'undefined') return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (!node || !node.nodeValue) continue;
        if (node.parentElement && node.parentElement.closest('mark,script,style,.is-search-companion')) continue;
        textNodes.push(node);
      }

      textNodes.forEach(node => {
        const source = node.nodeValue || '';
        const lower = source.toLowerCase();
        const ranges = [];
        activeTerms.forEach(term => {
          let index = lower.indexOf(term);
          while (index >= 0) {
            ranges.push({ start: index, end: index + term.length });
            index = lower.indexOf(term, index + Math.max(1, term.length));
          }
        });
        if (!ranges.length) return;

        ranges.sort((a, b) => (a.start - b.start) || (b.end - b.start) - (a.end - a.start));
        const merged = [];
        ranges.forEach(range => {
          const last = merged[merged.length - 1];
          if (!last || range.start >= last.end) {
            merged.push(range);
          } else if (range.end > last.end) {
            last.end = range.end;
          }
        });

        const fragment = document.createDocumentFragment();
        let cursor = 0;
        merged.forEach(range => {
          if (range.start > cursor) {
            fragment.appendChild(document.createTextNode(source.slice(cursor, range.start)));
          }
          const mark = document.createElement('mark');
          mark.className = 'search-hit';
          mark.textContent = source.slice(range.start, range.end);
          fragment.appendChild(mark);
          cursor = range.end;
        });
        if (cursor < source.length) {
          fragment.appendChild(document.createTextNode(source.slice(cursor)));
        }
        if (node.parentNode) {
          node.parentNode.replaceChild(fragment, node);
        }
      });
    }

    function getVisibleDetailEvents() {
      const query = viewerSearchQuery.trim().toLowerCase();
      const events = getCurrentDetailEventsWithKeys();
      if (!query) return events.filter(event => eventMatchesView(event));
      if (viewerSearchQuestionsOnly) {
        if (viewerViewMode === 'questions') {
          return events
            .filter(event => eventMatchesView(event) && questionMatchesSearch(event, query))
            .map(event => Object.assign({}, event, { isDirectSearchHit: true, isSearchCompanion: false }));
        }

        const output = [];
        let group = [];
        const appendQuestionGroup = items => {
          if (!items.length) return;
          const question = items[0] && items[0].kind === 'user' ? items[0] : null;
          if (!question || !questionMatchesSearch(question, query)) return;
          output.push(Object.assign({}, question, {
            isDirectSearchHit: true,
            isSearchCompanion: false
          }));
          items.forEach(event => {
            if (!event || event.kind !== 'assistant_final') return;
            output.push(Object.assign({}, event, {
              isDirectSearchHit: false,
              isSearchCompanion: true
            }));
          });
        };
        events.forEach(event => {
          if (!event) return;
          if (event.kind === 'user' && group.length) {
            appendQuestionGroup(group);
            group = [];
          }
          group.push(event);
        });
        appendQuestionGroup(group);
        return output;
      }
      if (viewerViewMode === 'questions') {
        return events
          .filter(event => eventMatchesView(event) && eventMatchesSearch(event, query))
          .map(event => Object.assign({}, event, { isDirectSearchHit: true, isSearchCompanion: false }));
      }

      const output = [];
      let group = [];

      function appendSearchGroup(items) {
        if (!items.length) return;
        const question = items[0] && items[0].kind === 'user' ? items[0] : null;
        if (!question) {
          items.forEach(event => {
            if (event && eventMatchesView(event) && eventMatchesSearch(event, query)) {
              output.push(Object.assign({}, event, { isDirectSearchHit: true, isSearchCompanion: false }));
            }
          });
          return;
        }

        const questionMatched = eventMatchesSearch(question, query);
        const answerMatched = items.some(event => event && event.kind === 'assistant_final' && eventMatchesSearch(event, query));
        const includeAnswerPair = questionMatched || answerMatched;
        const processMatched = items.some(event => {
          return event && !['user', 'assistant_final'].includes(event.kind) && eventMatchesSearch(event, query);
        });
        if (!includeAnswerPair && !processMatched) return;

        items.forEach(event => {
          if (!event || !eventMatchesView(event)) return;
          const direct = eventMatchesSearch(event, query);
          if (event.kind === 'user') {
            output.push(Object.assign({}, event, {
              isDirectSearchHit: direct,
              isSearchCompanion: !direct
            }));
            return;
          }
          if (event.kind === 'assistant_final') {
            if (!includeAnswerPair) return;
            output.push(Object.assign({}, event, {
              isDirectSearchHit: direct,
              isSearchCompanion: !direct
            }));
            return;
          }
          if (direct) {
            output.push(Object.assign({}, event, {
              isDirectSearchHit: true,
              isSearchCompanion: false
            }));
          }
        });
      }

      events.forEach(event => {
        if (!event) return;
        if (event.kind === 'user' && group.length) {
          appendSearchGroup(group);
          group = [];
        }
        group.push(event);
      });
      appendSearchGroup(group);
      return output;
    }

    function getSelectedSession() {
      if (!APP || !selectedWorkspaceId || !selectedSessionKey) return null;
      const workspace = APP.workspaces.find(item => item.id === selectedWorkspaceId);

    async function copyText(value) {
      const text = String(value || '');
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
      } catch (e) {
      }

      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      try {
        const copied = document.execCommand('copy');
        if (!copied) throw new Error('copy command failed');
      } finally {
        area.remove();
      }
    }

    function buildResumeCommand(session) {
      if (typeof isExternalSource === 'function' && isExternalSource()) return '';
      if (!session || !APP) return '';
      const cwd = getSessionCommandCwd(session);
      if (!session.id || !cwd) return '';
      if (isLocalClaudeSource()) {
        return 'Set-Location -LiteralPath ' + quotePowerShellSingle(cwd) + '; claude --resume ' + quotePowerShellSingle(session.id);
      }
      return 'codex resume ' + session.id + ' -C ' + JSON.stringify(cwd);
    }

    function escapePowerShellDoubleQuoted(value) {
      const psEscape = String.fromCharCode(96);
      const dq = String.fromCharCode(34);
      const cr = String.fromCharCode(13);
      const lf = String.fromCharCode(10);
      return String(value || '')
        .split(psEscape).join(psEscape + psEscape)
        .split(dq).join(psEscape + dq)
        .split(cr + lf).join(psEscape + 'n')
        .split(lf).join(psEscape + 'n')
        .split(cr).join(psEscape + 'n');
    }

    function getCurrentSourceType() {
      const source = typeof getCurrentSource === 'function' ? getCurrentSource() : null;
      return source && source.type ? String(source.type) : '';
    }

    function isLocalClaudeSource() {
      return getCurrentSourceType() === 'local-claude';
    }

    function quotePowerShellSingle(value) {
      return "'" + String(value || '').replace(/'/g, "''") + "'";
    }

    function getSessionCommandCwd(session) {
      const workspace = APP && APP.workspaces ? APP.workspaces.find(item => item.id === selectedWorkspaceId) : null;
      const workspaceCwd = String((workspace && workspace.cwd) || '');
      const sessionCwd = String((session && session.cwd) || '');
      return isLocalClaudeSource() ? (sessionCwd || workspaceCwd) : (workspaceCwd || sessionCwd);
    }

    function buildReplyResumeCommand(session, replyText) {
      if (typeof isExternalSource === 'function' && isExternalSource()) return '';
      if (!session || !APP) return '';
      const cwd = getSessionCommandCwd(session);
      const reply = String(replyText || '');
      if (!session.id || !cwd || !reply.trim()) return '';
      if (isLocalClaudeSource()) {
        return 'Set-Location -LiteralPath ' + quotePowerShellSingle(cwd) + '; claude -p --resume ' + quotePowerShellSingle(session.id) + ' ' + quotePowerShellSingle(reply);
      }
      return 'codex -C "' + escapePowerShellDoubleQuoted(cwd) + '" resume ' + session.id + ' "' + escapePowerShellDoubleQuoted(reply) + '"';
    }

    function canBuildReplyResumeCommand(session, replyText) {
      if (typeof isExternalSource === 'function' && isExternalSource()) return false;
      if (!session || !APP) return false;
      const cwd = getSessionCommandCwd(session);
      return !!(session.id && cwd && String(replyText || '').trim());
    }

    function getReplyDraftKey(session) {
      return session ? getSessionKey(session) : '';
    }

    function saveReplyDraftValueOnly() {
      if (!replyInput) return;
      const session = getSelectedSession();
      const key = getReplyDraftKey(session);
      if (!key) return;
      replyDrafts.set(key, replyInput.value || '');
    }

    function scheduleReplyComposerUpdate() {
      if (replyComposerUpdateFrame) return;
      const callback = () => {
        replyComposerUpdateFrame = 0;
        updateReplyComposerState();
      };
      if (typeof requestAnimationFrame === 'function') {
        replyComposerUpdateFrame = requestAnimationFrame(callback);
        return;
      }
      replyComposerUpdateFrame = 1;
      callback();
    }

    function persistReplyDraft() {
      saveReplyDraftValueOnly();
      if (replyInputIsComposing) return;
      scheduleReplyComposerUpdate();
    }

    function resetReplyInputMetrics() {
      replyInputMetrics = null;
    }

    function getReplyInputMetrics() {
      if (replyInputMetrics) return replyInputMetrics;
      const computed = typeof window !== 'undefined' && window.getComputedStyle && replyInput ? window.getComputedStyle(replyInput) : null;
      const lineHeight = computed ? (parseFloat(computed.lineHeight) || 26) : 26;
      const borderTop = computed ? (parseFloat(computed.borderTopWidth) || 0) : 0;
      const borderBottom = computed ? (parseFloat(computed.borderBottomWidth) || 0) : 0;
      const paddingTop = computed ? (parseFloat(computed.paddingTop) || 0) : 0;
      const paddingBottom = computed ? (parseFloat(computed.paddingBottom) || 0) : 0;
      replyInputMetrics = {
        lineHeight,
        maxHeight: Math.round(lineHeight * MAX_REPLY_LINES + paddingTop + paddingBottom + borderTop + borderBottom)
      };
      return replyInputMetrics;
    }

    function autoResizeReplyInput() {
      if (!replyInput || !replyInput.style) return;
      const metrics = getReplyInputMetrics();
      replyInput.style.height = 'auto';
      const scrollHeight = replyInput.scrollHeight || metrics.maxHeight;
      const nextHeight = Math.min(scrollHeight, metrics.maxHeight);
      replyInput.style.height = nextHeight + 'px';
      replyInput.style.overflowY = scrollHeight > metrics.maxHeight ? 'auto' : 'hidden';
    }

    function updateReplyComposerState() {
      if (!replyComposer || !replyInput) return;
      const session = getSelectedSession();
      if (!session || (typeof isExternalSource === 'function' && isExternalSource())) {
        replyComposer.classList.add('hidden');
        return;
      }
      replyComposer.classList.remove('hidden');
      const text = String(replyInput.value || '');
      const canSend = canBuildReplyResumeCommand(session, text);
      if (copyReplyCommandButton) copyReplyCommandButton.disabled = !canSend;
      if (clearReplyButton) clearReplyButton.disabled = !text.length;
      autoResizeReplyInput();
    }

    function syncReplyComposer() {
      if (!replyComposer || !replyInput) return;
      const session = getSelectedSession();
      if (!session || (typeof isExternalSource === 'function' && isExternalSource())) {
        replyComposer.classList.add('hidden');
        replyInput.value = '';
        resetReplyInputMetrics();
        updateReplyComposerState();
        return;
      }
      const key = getReplyDraftKey(session);
      replyInput.value = key && replyDrafts.has(key) ? (replyDrafts.get(key) || '') : '';
      resetReplyInputMetrics();
      updateReplyComposerState();
    }

    function clearReplyDraft() {
      if (!replyInput) return;
      const session = getSelectedSession();
      const key = getReplyDraftKey(session);
      replyInput.value = '';
      if (key) replyDrafts.set(key, '');
      resetReplyInputMetrics();
      updateReplyComposerState();
      if (typeof replyInput.focus === 'function') {
        replyInput.focus();
      }
    }

    async function copyReplyCommand() {
      if (typeof isExternalSource === 'function' && isExternalSource()) {
        showToast('外部来源不支持生成发送命令。', { tone: 'error', duration: 2400 });
        return;
      }
      const session = getSelectedSession();
      if (!session || !session.path) {
        showToast('当前没有可发送的会话路径。', { tone: 'error', duration: 2200 });
        return;

      if (!session.id) {
        showToast('当前会话缺少 SESSION id，无法生成发送命令。', { tone: 'error', duration: 2200 });
        return;
      }
      const reply = replyInput ? String(replyInput.value || '') : '';
      if (!reply.trim()) {
        showToast('请输入回复内容。', { tone: 'error', duration: 2200 });
        return;
      }
      const command = buildReplyResumeCommand(session, reply);
      if (!command) {
        showToast(isLocalClaudeSource() ? '当前 Claude 会话缺少可恢复命令所需信息。' : '当前会话缺少发送命令所需信息。', { tone: 'error', duration: 2200 });
        return;
      }
      try {
        await copyText(command);
        showToast('已复制发送命令。', { duration: 2200 });
      } catch (error) {
        showToast('复制发送命令失败，请手动复制。', { tone: 'error', duration: 2200 });

    }

    async function copyResumeCommand() {
      if (typeof isExternalSource === 'function' && isExternalSource()) {
        showToast('外部来源不支持复制 SESSION。', { tone: 'error', duration: 2400 });
        return;
      }
      const session = getSelectedSession();

    function buildMarkdown(detail) {
      const lines = [];
      lines.push('# ' + (detail.title || '未命名会话'));
      lines.push('');
      lines.push('- 路径：' + (detail.path || ''));
      lines.push('- 创建：' + (detail.createdLocal || ''));
      lines.push('- 更新：' + (detail.updatedLocal || ''));
      lines.push('');
      lines.push('---');
      lines.push('');

      (detail.events || []).forEach(event => {
        const label = event.kind === 'user' ? '用户' :
          event.kind === 'assistant_final' ? 'Assistant' :
          event.kind === 'assistant_commentary' ? '过程' :
          event.kind === 'system' ? '系统' :
          '工具';
        lines.push('## ' + label + ' (' + (event.timestampLocal || '') + ')');
        lines.push('');
        if (event.kind === 'tool') {
          if (event.summary) {
            lines.push(event.summary);
          }
          if (event.rawText) {
            if (event.summary) lines.push('');
            lines.push(event.rawText);
          }
          if (!event.summary && !event.rawText) {
            lines.push('');
          }
        } else {
          lines.push(event.rawText || event.summary || '');
          if (event.images && event.images.length) {
            if (event.rawText || event.summary) lines.push('');
            lines.push('[图片 ' + event.images.length + ' 张，已在网页中内联显示]');
          }
        }
        lines.push('');
      });

      return lines.join('\n');

      const fileName = sanitizeFileName((session.title || '会话') + '__' + stem.replace(/\.jsonl$/i, '') + '.md');
      const markdown = buildMarkdown(detail);

      document.body.appendChild(link);

        imagePreviewTransform.translateY = 0;
        return;

      const scaledHeight = base.height * imagePreviewTransform.scale;
      const visibleX = Math.min(IMAGE_PREVIEW_MIN_VISIBLE, scaledWidth);
      const visibleY = Math.min(IMAGE_PREVIEW_MIN_VISIBLE, scaledHeight);
      const maxX = Math.max(0, (stageWidth + scaledWidth) / 2 - visibleX);
      const maxY = Math.max(0, (stageHeight + scaledHeight) / 2 - visibleY);

      Object.assign(imagePreviewTransform, {

        translateX: 0,
        translateY: 0,
        pointerId: null,
        dragStartX: 0,
        dragStartY: 0,
        dragOriginX: 0,
        dragOriginY: 0,

      imagePreviewTransform.wheelClientY = Number(event.clientY) || 0;

        const wheelDelta = imagePreviewTransform.wheelDelta;
        imagePreviewTransform.wheelDelta = 0;
        if (!wheelDelta) return;

          Math.min(IMAGE_PREVIEW_MAX_SCALE, previousScale * Math.exp(-wheelDelta * 0.002))
        );

        const stageRect = imagePreviewStage.getBoundingClientRect();
        const pointerX = imagePreviewTransform.wheelClientX - stageRect.left - stageRect.width / 2;
        const pointerY = imagePreviewTransform.wheelClientY - stageRect.top - stageRect.height / 2;

        imagePreviewTransform.translateX = pointerX - (pointerX - imagePreviewTransform.translateX) * ratio;
        imagePreviewTransform.translateY = pointerY - (pointerY - imagePreviewTransform.translateY) * ratio;

        clampImagePreviewTranslation();
        applyImagePreviewTransform();
      });
    }

    function handleImagePreviewPointerDown(event) {

      event.preventDefault();
      imagePreviewTransform.pointerId = event.pointerId;
      imagePreviewTransform.dragStartX = event.clientX;
      imagePreviewTransform.dragStartY = event.clientY;
      imagePreviewTransform.dragOriginX = imagePreviewTransform.translateX;
      imagePreviewTransform.dragOriginY = imagePreviewTransform.translateY;
      imagePreviewTransform.dragClientX = event.clientX;
      imagePreviewTransform.dragClientY = event.clientY;
      imagePreviewTransform.dragMoved = false;
      if (imagePreviewStage.setPointerCapture) imagePreviewStage.setPointerCapture(event.pointerId);

    }

    function updateImagePreviewDrag() {

      imagePreviewTransform.translateX = imagePreviewTransform.dragOriginX + imagePreviewTransform.dragClientX - imagePreviewTransform.dragStartX;
      imagePreviewTransform.translateY = imagePreviewTransform.dragOriginY + imagePreviewTransform.dragClientY - imagePreviewTransform.dragStartY;
      clampImagePreviewTranslation();
      applyImagePreviewTransform();
    }

    function handleImagePreviewPointerMove(event) {
      if (!event || imagePreviewTransform.pointerId === null || event.pointerId !== imagePreviewTransform.pointerId) return false;

      const deltaY = event.clientY - imagePreviewTransform.dragStartY;

      event.preventDefault();
      imagePreviewTransform.dragMoved = true;
      imagePreviewTransform.dragClientX = event.clientX;
      imagePreviewTransform.dragClientY = event.clientY;
      if (!imagePreviewTransform.dragFrame) {
        imagePreviewTransform.dragFrame = requestAnimationFrame(updateImagePreviewDrag);
      }
      return true;
    }

    function handleImagePreviewPointerEnd(event) {

      if (imagePreviewTransform.dragFrame) {
        cancelAnimationFrame(imagePreviewTransform.dragFrame);
        imagePreviewTransform.dragClientX = event.clientX;
        imagePreviewTransform.dragClientY = event.clientY;
        updateImagePreviewDrag();
      }
      releaseImagePreviewPointer();
      if (event.type === 'pointercancel') imagePreviewTransform.dragMoved = false;
      applyImagePreviewTransform();
      return true;

    function updateImagePreviewControls() {

      imagePreviewPrev.hidden = !hasMultiple;
      imagePreviewNext.hidden = !hasMultiple;
      imagePreviewCount.hidden = !hasMultiple;
      imagePreviewPrev.disabled = !hasMultiple || imagePreviewIndex <= 0;
      imagePreviewNext.disabled = !hasMultiple || imagePreviewIndex >= total - 1;

    }

    function showImagePreviewAt(index) {

      imagePreviewTrigger = button;
      imagePreviewStatus.hidden = true;

    function getEventImageSource(image) {
      if (!image) return '';

        return IMAGE_ASSET_API_URL +
          '?sourceId=' + encodeURIComponent(getCurrentSourceId()) +

      }
      if (image.type !== 'local') return String(image.src || '');
      if (image.status === 'too-large' || !image.imageId) return '';
      const session = getSelectedSession();
      const sessionKey = getSessionKey(session);
      if (!sessionKey) return '';

        '?sourceId=' + encodeURIComponent(getCurrentSourceId()) +

        '&imageId=' + encodeURIComponent(String(image.imageId));
    }

    function hashMessageImageSource(value) {
      const text = String(value || '');
      let hash = 2166136261;
      for (let index = 0; index < text.length; index += 1) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(36);

    function getMessageImageFailureKey(image, src) {

      const sessionKey = encodeURIComponent(String(getSessionKey(getSelectedSession()) || ''));

      let imageKey = 'src:' + source;
      if (image && typeof image !== 'string' && image.type === 'managed' && image.assetId) {

        imageKey = 'local:' + String(image.imageId);
      } else if (/^data:/i.test(source)) {

    }

    function rememberFailedMessageImage(key) {

    function isExplicitQuoteBlock(text) {
      const lines = String(text || '').split('\n').map(line => line.trimEnd());
      const meaningfulLines = lines.filter(line => line.trim());
      return meaningfulLines.length > 0 && meaningfulLines.every(line => /^> ?/.test(line));
    }

    function detectExplicitListType(text) {
      const meaningfulLines = String(text || '')
        .split('\n')
        .map(line => line.trim())
        .filter(line => line);
      if (!meaningfulLines.length) return '';

      if (meaningfulLines.every(line => /^- /.test(line))) return 'bullet';
      if (meaningfulLines.every(line => /^\d+\. /.test(line))) return 'numbered';
      return '';
    }

    function splitMarkdownTableRow(line) {
      const trimmed = String(line || '').trim();
      if (!trimmed.startsWith('|') || !trimmed.endsWith('|')) return null;
      const cells = trimmed.slice(1, -1).split('|').map(cell => cell.trim());
      return cells.length >= 2 ? cells : null;
    }

    function getMarkdownTableAlignment(cell) {
      if (!/^:?-{3,}:?$/.test(cell)) return false;
      if (/^:-+:$/.test(cell)) return 'center';
      if (/^-+:$/.test(cell)) return 'right';
      return 'left';
    }

    function parseMarkdownTable(text) {
      const lines = String(text || '')
        .split('\n')
        .map(line => line.trim())
        .filter(line => line);
      if (lines.length < 3) return null;

      const headers = splitMarkdownTableRow(lines[0]);
      const separators = splitMarkdownTableRow(lines[1]);
      if (!headers || !separators || headers.length !== separators.length || headers.some(cell => !cell)) return null;

      const alignments = separators.map(getMarkdownTableAlignment);
      if (alignments.some(alignment => alignment === false)) return null;

      const rows = [];
      for (let index = 2; index < lines.length; index++) {
        const row = splitMarkdownTableRow(lines[index]);
        if (!row || row.length !== headers.length) return null;
        rows.push(row);
      }

      if (!rows.length) return null;
      return { headers, alignments, rows };
    }

    function parseDeterministicBlocks(text) {
      const source = String(text || '').replace(/\r\n/g, '\n');
      const blocks = [];
      const parts = source.split(/```/);

      for (let index = 0; index < parts.length; index++) {
        if (index % 2 === 1) {
          const lines = parts[index].split('\n');
          const language = (lines.shift() || '').trim();
          blocks.push({ type: 'code', language, text: lines.join('\n').trimEnd() });
          continue;
        }

        parts[index].split(/\n{2,}/).forEach(chunk => {
          const value = chunk.trim();
          if (!value) return;
          const table = parseMarkdownTable(value);
          if (table) blocks.push(Object.assign({ type: 'table' }, table));
          else if (isExplicitQuoteBlock(value)) blocks.push({ type: 'quote', text: value.replace(/^> ?/gm, '') });
          else if (detectExplicitListType(value)) blocks.push({ type: 'list', text: value });
          else blocks.push({ type: 'paragraph', text: value });
        });
      }

      return blocks;
    }

    function renderStrongTextSegment(segment) {
      const source = String(segment || '');
      let output = '';
      let index = 0;
      while (index < source.length) {
        const open = source.indexOf('**', index);
        if (open < 0) {
          output += escapeHtml(source.slice(index));
          break;
        }
        const close = source.indexOf('**', open + 2);
        const newline = source.indexOf('\n', open + 2);
        if (close < 0 || (newline >= 0 && newline < close)) {
          output += escapeHtml(source.slice(index));
          break;
        }
        const content = source.slice(open + 2, close);
        if (!content) {
          output += escapeHtml(source.slice(index, close + 2));
          index = close + 2;
          continue;
        }
        output += escapeHtml(source.slice(index, open));
        output += '<strong>' + escapeHtml(content) + '</strong>';
        index = close + 2;
      }
      return output;
    }

    function renderInlineText(text) {
      return String(text || '').split(/(`[^`\n]+`)/g).map(segment => {
        if (/^`[^`\n]+`$/.test(segment)) {
          return '<code>' + escapeHtml(segment.slice(1, -1)) + '</code>';
        }
        return renderStrongTextSegment(segment);
      }).join('');
    }

    function renderListBlock(text) {
      const listType = detectExplicitListType(text);
      if (!listType) return '<div class="message-body">' + escapeHtml(text) + '</div>';

      const tagName = listType === 'numbered' ? 'ol' : 'ul';
      const itemPattern = listType === 'numbered' ? /^\d+\. / : /^- /;
      const lines = String(text || '')
        .split('\n')
        .map(line => line.trim())
        .filter(line => line);
      const firstNumberedLine = listType === 'numbered' ? (lines.find(line => /^\d+\. /.test(line)) || '') : '';
      const startMatch = firstNumberedLine.match(/^(\d+)\. /);
      const startNumber = startMatch ? Number(startMatch[1]) : 1;
      const startAttr = listType === 'numbered' && Number.isSafeInteger(startNumber) && startNumber >= 0 && startNumber !== 1
        ? ' start="' + String(startNumber) + '"'
        : '';
      const items = lines.map(line => line.replace(itemPattern, ''));

      return '<' + tagName + startAttr + ' class="message-list">' + items.map(item => '<li>' + renderInlineText(item) + '</li>').join('') + '</' + tagName + '>';
    }

    function renderTableCell(tagName, value, alignment) {
      const className = alignment === 'center' || alignment === 'right' ? ' class="align-' + alignment + '"' : '';
      return '<' + tagName + className + '>' + renderInlineText(value) + '</' + tagName + '>';
    }

    function renderTableBlock(block) {
      const headerHtml = '<tr>' + block.headers.map((cell, index) => renderTableCell('th', cell, block.alignments[index])).join('') + '</tr>';
      const rowsHtml = block.rows.map(row => {
        return '<tr>' + row.map((cell, index) => renderTableCell('td', cell, block.alignments[index])).join('') + '</tr>';
      }).join('');
      return '<div class="message-table-wrap"><table class="message-table"><thead>' + headerHtml + '</thead><tbody>' + rowsHtml + '</tbody></table></div>';
    }

    function renderDeterministicMarkdown(text) {
      const blocks = parseDeterministicBlocks(text || '');
      return blocks.map(block => {
        if (block.type === 'code') return '<pre class="code-block"><code>' + escapeHtml(block.text) + '</code></pre>';
        if (block.type === 'quote') return '<blockquote>' + renderInlineText(block.text) + '</blockquote>';
        if (block.type === 'list') return renderListBlock(block.text);
        if (block.type === 'table') return renderTableBlock(block);
        return '<p class="message-body">' + renderInlineText(block.text) + '</p>';
      }).join('');
    }

    const lazyDetailRenderers = new Map();
    let lazyDetailSerial = 0;

    function resetLazyDetailRenderers() {
      lazyDetailRenderers.clear();
      lazyDetailSerial = 0;
    }

    function renderToolRawBlock(text) {
      const content = String(text || '');
      if (!content) return '';
      return '<pre class="code-block"><code>' + escapeHtml(content) + '</code></pre>';
    }

    function renderLazyDetails(className, summaryHtml, bodyRenderer, options) {
      const id = 'lazy-detail-' + (++lazyDetailSerial);
      lazyDetailRenderers.set(id, bodyRenderer);
      const shouldOpen = !!(options && options.autoExpandGroups);
      return '<details class="' + className + '"' + (shouldOpen ? ' open' : '') + '><summary>' + summaryHtml + '</summary><div class="message-blocks" data-lazy-detail-id="' + id + '" data-lazy-detail-body></div></details>';
    }

    function renderProcessDetailItem(item) {
      if (!item) return '';
      if (item.kind === 'assistant_commentary') {
        return '<div class="message message--commentary"><div class="message-head"><span class="role">过程</span><span>' + escapeHtml(item.timestampLocal || '') + '</span></div><div class="message-blocks">' + renderDeterministicMarkdown(item.rawText || '') + '</div></div>';
      }
      if (item.kind === 'system') {
        return '<div class="message message--tool"><div class="message-head"><span class="role">系统</span><span>' + escapeHtml(item.timestampLocal || '') + '</span></div><div class="message-blocks">' + renderDeterministicMarkdown(item.rawText || item.summary || '') + '</div></div>';
      }
      return '<div class="message message--tool"><div class="message-head"><span class="role">' + escapeHtml(item.toolName || 'tool') + '</span><span>' + escapeHtml(item.status || '') + '</span></div><div class="message-blocks">' + (item.summary ? '<p class="message-body">' + renderInlineText(item.summary) + '</p>' : '') + renderToolRawBlock(item.rawText || '') + '</div></div>';
    }

    function summarizeProcessItems(items, options) {
      const summaryCounts = {
        process: 0,
        tool: 0,
        system: 0
      };
      const query = options && options.searchQuery ? String(options.searchQuery).trim().toLowerCase() : '';

      items.forEach(item => {
        if (!item) return;
        if (item.kind === 'assistant_commentary') summaryCounts.process++;
        else if (item.kind === 'system') summaryCounts.system++;
        else summaryCounts.tool++;
      });

      const summaryParts = ['执行过程', items.length + ' 条'];
      if (summaryCounts.process) summaryParts.push('过程 ' + summaryCounts.process);
      if (summaryCounts.tool) summaryParts.push('工具 ' + summaryCounts.tool);
      if (summaryCounts.system) summaryParts.push('系统 ' + summaryCounts.system);
      if (query) summaryParts.push('命中 ' + items.length);
      return '执行过程（' + summaryParts.slice(1).join(' · ') + '）';
    }

    function renderEvent(event, options) {
      const copyButton = renderCopyButton(event);
      const searchClass = event.isDirectSearchHit
        ? ' is-search-direct-hit'
        : (event.isSearchCompanion ? ' is-search-companion' : '');
      if (event.kind === 'user') {
        const questionKey = (options && options.questionKey) || event.questionKey || '';
        const dataAttrs = questionKey ? ' data-question-key="' + escapeHtml(questionKey) + '" tabindex="0"' : '';
        const activeClass = options && options.isCurrentQuestion ? ' is-current-question' : '';
        return '<article class="message user message-question' + activeClass + searchClass + '"' + dataAttrs + '><div class="message-head"><span class="message-head-main"><span class="role">用户</span><span>' + escapeHtml(event.timestampLocal || '') + '</span></span>' + copyButton + '</div><div class="message-blocks">' + renderDeterministicMarkdown(event.rawText || '') + renderEventImages(event) + '</div></article>';
      }

      if (event.kind === 'assistant_final') {
        const answerForQuestionKey = options && options.answerForQuestionKey ? options.answerForQuestionKey : '';
        const answerDataAttr = answerForQuestionKey
          ? ' data-answer-for-question-key="' + escapeHtml(answerForQuestionKey) + '"'
          : '';
        return '<article class="message message--final assistant' + searchClass + '"' + answerDataAttr + '><div class="message-head"><span class="message-head-main"><span class="role">Assistant</span><span>' + escapeHtml(event.timestampLocal || '') + '</span></span>' + copyButton + '</div><div class="message-blocks">' + renderDeterministicMarkdown(event.rawText || '') + '</div></article>';
      }

      return '';
    }

    function renderCollapsedProcessItems(items, options) {
      if (!items.length) return '';
      const summaryHtml = summarizeProcessItems(items, options);
      return renderLazyDetails('collapsed-group', summaryHtml, () => items.map(item => renderProcessDetailItem(item)).join(''), options);
    }

    function hydrateLazyDetail(details) {
      if (!details || !details.querySelector) return;
      const body = details.querySelector('[data-lazy-detail-body]');
      if (!body) return;
      const rendererId = body.getAttribute('data-lazy-detail-id');
      const renderer = rendererId ? lazyDetailRenderers.get(rendererId) : null;
      if (details.open) {
        if (body.dataset.rendered !== '1') {
          body.innerHTML = renderer ? renderer() : '';
          body.dataset.rendered = '1';
          highlightMatchesInElement(body, getSearchTerms(viewerSearchQuery));
        }
        return;
      }
      body.innerHTML = '';
      delete body.dataset.rendered;
    }

    function hydrateOpenLazyDetails(root) {
      if (!root || !root.querySelectorAll) return;
      root.querySelectorAll('details[open]').forEach(hydrateLazyDetail);
    }

    function renderReaderToolbarActions(session) {
      let sessionButton = '';
      if (typeof isExternalSource === 'function' && isExternalSource()) {
        sessionButton = '<button type="button" disabled title="外部来源不支持复制 SESSION">SESSION</button>';
      } else if (!buildResumeCommand(session)) {
        const title = isLocalClaudeSource() ? '当前 Claude 会话缺少可恢复命令所需信息' : '当前会话缺少 session id 或工作目录';
        sessionButton = '<button type="button" disabled title="' + escapeHtml(title) + '">SESSION</button>';
      } else {
        const title = isLocalClaudeSource() ? '复制 claude --resume 命令' : '复制 codex resume 命令';
        sessionButton = '<button type="button" onclick="copyResumeCommand()" title="' + escapeHtml(title) + '">SESSION</button>';
      }
      return '<button type="button" onclick="copyCurrentPath()" title="复制当前会话路径">路径</button>' +
        '<button type="button" onclick="exportSelectedMarkdown()">导出 MD</button>' +
        sessionButton +
        '<button type="button" id="refreshCurrentButton" class="quick-refresh-btn" onclick="refreshCurrentSession()" title="只重新读取当前会话"' + ((typeof getSourceCapability !== 'function' || getSourceCapability('canQuickRefresh')) ? '' : ' disabled') + '>快刷</button>' +
      '';
    }

    function updateQuestionNavState() {
      const questions = getNavigableQuestionKeys();
      const disabled = !questions.length;
      if (questionNextButton) questionNextButton.disabled = disabled;
    }

    function getNavigableQuestionKeys() {
      if (getSearchTerms(viewerSearchQuery).length && transcript && typeof transcript.querySelectorAll === 'function') {
        const keys = [];
        transcript.querySelectorAll('[data-question-key]').forEach(node => {
          const key = node && node.dataset ? node.dataset.questionKey : '';
          if (key && !keys.includes(key)) keys.push(key);
        });
        return keys;
      }
      return getQuestionEvents().map(event => event.questionKey).filter(Boolean);
    }

    function findQuestionElement(questionKey) {
      if (!questionKey || !transcript) return null;
      return Array.from(transcript.querySelectorAll('[data-question-key]')).find(node => node.dataset.questionKey === questionKey) || null;
    }

    function findAnswerElement(questionKey) {
      if (!questionKey || !transcript) return null;
      return Array.from(transcript.querySelectorAll('[data-answer-for-question-key]')).find(node => {
        return node.dataset.answerForQuestionKey === questionKey;
      }) || null;
    }

    let activeQuestionScrollAnimation = 0;
    let activeQuestionScrollToken = 0;
    let transcriptLayoutLockTimer = 0;

    function cancelQuestionScrollAnimation() {
      if (!activeQuestionScrollAnimation) return;
      cancelAnimationFrame(activeQuestionScrollAnimation);
      activeQuestionScrollAnimation = 0;
    }

    function lockTranscriptLayoutForProgrammaticScroll(timeoutMs, onUnlock) {
      if (!transcript || !transcript.classList) return;
      transcript.classList.add('is-programmatic-scroll');
      if (transcriptLayoutLockTimer) clearTimeout(transcriptLayoutLockTimer);
      const lockMs = Number.isFinite(timeoutMs) && timeoutMs > 0 ? timeoutMs : 1200;
      transcriptLayoutLockTimer = setTimeout(() => {
        transcript.classList.remove('is-programmatic-scroll');
        transcriptLayoutLockTimer = 0;
        if (typeof onUnlock === 'function') onUnlock();
      }, lockMs);
    }

    function unlockTranscriptLayoutForProgrammaticScroll() {
      if (transcriptLayoutLockTimer) {
        clearTimeout(transcriptLayoutLockTimer);
        transcriptLayoutLockTimer = 0;
      }
      if (transcript && transcript.classList) {
        transcript.classList.remove('is-programmatic-scroll');
      }
    }

    function calculateTranscriptScrollSpacer(element) {
      if (!transcript || !element) return 0;
      const currentSpacerValue = transcript.style && typeof transcript.style.getPropertyValue === 'function'
        ? Number.parseFloat(transcript.style.getPropertyValue('--transcript-scroll-spacer'))
        : 0;
      const currentSpacer = Number.isFinite(currentSpacerValue) ? Math.max(0, currentSpacerValue) : 0;
      const remainingBelow = Math.max(0, transcript.scrollHeight - currentSpacer - (element.offsetTop + element.offsetHeight));
      const requiredBelow = Math.max(0, transcript.clientHeight - element.offsetHeight - 32);
      return Math.max(0, requiredBelow - remainingBelow + 32);
    }

    function scrollElementToTranscriptTop(element) {
      if (!transcript || !element || typeof transcript.scrollTo !== 'function') return false;
      cancelQuestionScrollAnimation();
      const token = ++activeQuestionScrollToken;
      lockTranscriptLayoutForProgrammaticScroll(250);
      const measureElementTop = () => {
        return typeof element.getBoundingClientRect === 'function' && typeof transcript.getBoundingClientRect === 'function'
          ? element.getBoundingClientRect().top - transcript.getBoundingClientRect().top
          : 16;
      };
      const measureTargetTop = () => Math.max(0, (transcript.scrollTop || 0) + measureElementTop() - 16);
      const prepareSpacer = () => {
        if (transcript.style) {
          transcript.style.setProperty('--transcript-scroll-spacer', '0px');
          let spacer = calculateTranscriptScrollSpacer(element);
          transcript.style.setProperty('--transcript-scroll-spacer', spacer + 'px');
          const missingScrollRoom = measureTargetTop() - Math.max(0, transcript.scrollHeight - transcript.clientHeight);
          if (missingScrollRoom > 0) {
            spacer += missingScrollRoom;
            transcript.style.setProperty('--transcript-scroll-spacer', spacer + 'px');
          }
        }
      };
      const scrollToMeasuredTarget = () => transcript.scrollTo({ top: measureTargetTop(), behavior: 'auto' });
      requestAnimationFrame(() => {
        if (token !== activeQuestionScrollToken) return;
        prepareSpacer();
        scrollToMeasuredTarget();
        requestAnimationFrame(() => {
          if (token !== activeQuestionScrollToken) return;
          unlockTranscriptLayoutForProgrammaticScroll();
          requestAnimationFrame(() => {
            if (token !== activeQuestionScrollToken) return;
            if (Math.abs(measureElementTop() - 16) > 6) scrollToMeasuredTarget();
          });
        });
      });
      return true;
    }

    function scrollTranscriptTo(top, behavior, fallbackElement, options) {
      cancelQuestionScrollAnimation();
      const token = ++activeQuestionScrollToken;
      const targetTop = Math.max(0, top);
      if (!transcript || typeof transcript.scrollTo !== 'function') {
        if (fallbackElement && typeof fallbackElement.scrollIntoView === 'function') {
          fallbackElement.scrollIntoView({
            block: 'start',
            behavior: behavior || 'auto'
          });
        }
        return;
      }
      if (options && options.lockLayout) lockTranscriptLayoutForProgrammaticScroll();
      if ((behavior || 'auto') !== 'smooth' || typeof requestAnimationFrame !== 'function') {
        transcript.scrollTo({
          top: targetTop,
          behavior: behavior || 'auto'
        });
        if (!(options && options.keepLayoutLocked)) unlockTranscriptLayoutForProgrammaticScroll();
        return;
      }

      const startTop = transcript.scrollTop || 0;
      const distance = targetTop - startTop;
      const startedAt = performance.now();
      const duration = 220;
      const step = now => {
        if (token !== activeQuestionScrollToken) return;
        const progress = Math.min(1, (now - startedAt) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        transcript.scrollTop = startTop + distance * eased;
        if (progress < 1) {
          activeQuestionScrollAnimation = requestAnimationFrame(step);
        } else {
          activeQuestionScrollAnimation = 0;
          if (!(options && options.keepLayoutLocked)) unlockTranscriptLayoutForProgrammaticScroll();
        }
      };
      activeQuestionScrollAnimation = requestAnimationFrame(step);
    }

    function convergeScrollToQuestion(questionKey, behavior) {
      const token = ++activeQuestionScrollToken;
      lockTranscriptLayoutForProgrammaticScroll();
      let stableFrames = 0;
      let attempts = 0;
      const maxAttempts = 36;
      const settleUnlockedQuestion = () => {
        let unlockedStableFrames = 0;
        let unlockedAttempts = 0;
        const maxUnlockedAttempts = 36;
        const settle = () => {
          if (token !== activeQuestionScrollToken) return;
          const element = findQuestionElement(questionKey);
          if (!element || !transcript) return;
          if (transcript.style) {
            const spacer = calculateTranscriptScrollSpacer(element);
            transcript.style.setProperty('--transcript-scroll-spacer', spacer + 'px');
          }
          let targetTop = element.offsetTop - 16;
          if (typeof transcript.getBoundingClientRect === 'function' && typeof element.getBoundingClientRect === 'function') {
            const transcriptRect = transcript.getBoundingClientRect();
            const elementRect = element.getBoundingClientRect();
            targetTop = (transcript.scrollTop || 0) + (elementRect.top - transcriptRect.top) - 16;
          }
          const nextTop = Math.max(0, targetTop);
          transcript.scrollTo({ top: nextTop, behavior: 'auto' });
          const elementTop = typeof element.getBoundingClientRect === 'function' && typeof transcript.getBoundingClientRect === 'function'
            ? element.getBoundingClientRect().top - transcript.getBoundingClientRect().top
            : 16;
          unlockedStableFrames = Math.abs(elementTop - 16) <= 3 ? unlockedStableFrames + 1 : 0;
          unlockedAttempts++;
          if (unlockedStableFrames >= 3 || unlockedAttempts >= maxUnlockedAttempts) return;
          requestAnimationFrame(settle);
        };
        requestAnimationFrame(settle);
      };
      const settle = () => {
        if (token !== activeQuestionScrollToken) return;
        const element = findQuestionElement(questionKey);
        if (!element || !transcript) {
          unlockTranscriptLayoutForProgrammaticScroll();
          return;
        }
        if (transcript.style) {
          const spacer = calculateTranscriptScrollSpacer(element);
          transcript.style.setProperty('--transcript-scroll-spacer', spacer + 'px');
        }
        let targetTop = element.offsetTop - 16;
        if (typeof transcript.getBoundingClientRect === 'function' && typeof element.getBoundingClientRect === 'function') {
          const transcriptRect = transcript.getBoundingClientRect();
          const elementRect = element.getBoundingClientRect();
          targetTop = (transcript.scrollTop || 0) + (elementRect.top - transcriptRect.top) - 16;
        }
        const nextTop = Math.max(0, targetTop);
        transcript.scrollTo({ top: nextTop, behavior: 'auto' });
        const delta = Math.abs((transcript.scrollTop || 0) - nextTop);
        stableFrames = delta < 2 ? stableFrames + 1 : 0;
        attempts++;
        if (stableFrames >= 3 || attempts >= maxAttempts) {
          unlockTranscriptLayoutForProgrammaticScroll();
          settleUnlockedQuestion();
          return;
        }
        requestAnimationFrame(settle);
      };
      requestAnimationFrame(settle);
    }

    function stableScrollToQuestionForKeyboard(questionKey) {
      cancelQuestionScrollAnimation();
      const token = ++activeQuestionScrollToken;
      const measureElementTop = element => {
        return typeof element.getBoundingClientRect === 'function' && typeof transcript.getBoundingClientRect === 'function'
          ? element.getBoundingClientRect().top - transcript.getBoundingClientRect().top
          : 16;
      };
      let scrollToMeasuredTarget = null;
      lockTranscriptLayoutForProgrammaticScroll(250, () => {
        if (token !== activeQuestionScrollToken) return;
        const element = findQuestionElement(questionKey);
        if (!element || !transcript || typeof scrollToMeasuredTarget !== 'function') return;
        if (transcript.style) {
          const spacer = calculateTranscriptScrollSpacer(element);
          transcript.style.setProperty('--transcript-scroll-spacer', spacer + 'px');
        }
        if (Math.abs(measureElementTop(element) - 16) > 6) {
          scrollToMeasuredTarget();
        }
      });
      const run = () => {
        if (token !== activeQuestionScrollToken) return;
        const element = findQuestionElement(questionKey);
        if (!element || !transcript) {
          unlockTranscriptLayoutForProgrammaticScroll();
          return;
        }
        if (transcript.style) {
          const spacer = calculateTranscriptScrollSpacer(element);
          transcript.style.setProperty('--transcript-scroll-spacer', spacer + 'px');
        }
        const measureTargetTop = () => {
          let targetTop = element.offsetTop - 16;
          if (typeof transcript.getBoundingClientRect === 'function' && typeof element.getBoundingClientRect === 'function') {
            const transcriptRect = transcript.getBoundingClientRect();
            const elementRect = element.getBoundingClientRect();
            targetTop = (transcript.scrollTop || 0) + (elementRect.top - transcriptRect.top) - 16;
          }
          return Math.max(0, targetTop);
        };
        scrollToMeasuredTarget = () => {
          transcript.scrollTo({
            top: measureTargetTop(),
            behavior: 'auto'
          });
        };
        scrollToMeasuredTarget();
        requestAnimationFrame(() => {
          if (token !== activeQuestionScrollToken) return;
          const elementTop = measureElementTop(element);
          if (Math.abs(elementTop - 16) > 6) {
            scrollToMeasuredTarget();
          }
        });
      };
      requestAnimationFrame(run);
    }

    function scrollToQuestion(questionKey, behavior) {
      const element = findQuestionElement(questionKey);
      if (!element) return false;
      if (behavior === 'keyboard') {
        stableScrollToQuestionForKeyboard(questionKey);
        return true;
      }
      if (transcript && transcript.style) {
        const spacer = calculateTranscriptScrollSpacer(element);
        transcript.style.setProperty('--transcript-scroll-spacer', spacer + 'px');
      }
      let targetTop = element.offsetTop - 16;
      if (transcript && typeof transcript.getBoundingClientRect === 'function' && typeof element.getBoundingClientRect === 'function') {
        const transcriptRect = transcript.getBoundingClientRect();
        const elementRect = element.getBoundingClientRect();
        targetTop = (transcript.scrollTop || 0) + (elementRect.top - transcriptRect.top) - 16;
      }
      if (behavior === 'smooth') {
        convergeScrollToQuestion(questionKey, behavior);
      } else {
        scrollTranscriptTo(targetTop, behavior === 'keyboard' ? 'auto' : (behavior || 'auto'), element);
      }
      return true;
    }

    function highlightCurrentQuestion() {
      if (!transcript) return;
      transcript.querySelectorAll('[data-question-key]').forEach(node => {
        node.classList.toggle('is-current-question', !!selectedQuestionKey && node.dataset.questionKey === selectedQuestionKey);
      });
      updateQuestionNavState();
    }

    function setSelectedQuestionKey(questionKey, options) {
      const settings = options || {};
      selectedQuestionKey = questionKey || null;
      selectedQuestionKeyIsTemporary = !!settings.temporary;
      highlightCurrentQuestion();
      if (selectedQuestionKey && settings.persistAnchor !== false && typeof saveProgressAnchorForCurrentSession === 'function') {
        saveProgressAnchorForCurrentSession();
      }
      if (settings && settings.scroll) {
        const behavior = settings.behavior || 'smooth';
        if (behavior === 'keyboard') {
          stableScrollToQuestionForKeyboard(selectedQuestionKey);
        } else {
          requestAnimationFrame(() => scrollToQuestion(selectedQuestionKey, behavior));
        }
      }
    }

    function focusFirstQuestion(options) {
      const questions = syncSelectedQuestionKey('first');
      if (!questions.length) return false;
      setSelectedQuestionKey(questions[0].questionKey, options || { scroll: false });
      return true;
    }

    function focusLastQuestion(options) {
      const questions = syncSelectedQuestionKey('last');
      if (!questions.length) return false;
      setSelectedQuestionKey(questions[questions.length - 1].questionKey, options || { scroll: false });
      return true;
    }

    function jumpQuestion(direction) {
      const questions = getNavigableQuestionKeys();
      if (!questions.length) return;
      let index = questions.indexOf(selectedQuestionKey);
      if (viewerSearchQuery.trim() && index < 0) return;
      if (index < 0) index = direction > 0 ? -1 : questions.length;
      const nextIndex = Math.max(0, Math.min(questions.length - 1, index + direction));
      const nextQuestionKey = questions[nextIndex];
      if (!nextQuestionKey) return;
      setSelectedQuestionKey(nextQuestionKey, { scroll: true, behavior: 'keyboard' });
    }

    function handleTranscriptEnter(event) {
      if (!event || event.key !== 'Enter' || event.isComposing) return false;
      if (event.shiftKey || event.ctrlKey || event.altKey || event.metaKey) return false;
      if (!selectedQuestionKey || !transcript) return false;
      if (typeof imagePreviewModal !== 'undefined' && imagePreviewModal && !imagePreviewModal.hidden) return false;
      if (typeof noteModal !== 'undefined' && noteModal && !noteModal.hidden) return false;
      const active = typeof document !== 'undefined' ? document.activeElement : null;
      if (active !== transcript && (!transcript.contains || !transcript.contains(active))) return false;
      if (event.target && event.target.closest && event.target.closest('button, a, input, textarea, select, [contenteditable="true"]')) {
        return false;
      }
      event.preventDefault();
      if (viewerViewMode === 'questions') {
        pendingAnswerFocusQuestionKey = selectedQuestionKey;
        viewerViewMode = 'all';
        renderViewer();
        return true;
      }
      const answer = findAnswerElement(selectedQuestionKey);
      if (!answer) {
        showToast('该提问暂时没有最终回答', { duration: 2200 });
        return false;
      }
      scrollElementToTranscriptTop(answer);
      return true;
    }

    function handleQuestionSelectionFromRender() {
      const questions = syncSelectedQuestionKey(null, { useProgressAnchor: true });
      if (!questions.length) return;
      highlightCurrentQuestion();
    }

    function syncViewerToolbar(session) {
      if (!session) {
        viewerToolbar.classList.add('hidden');
        viewerToolbarActions.innerHTML = '';
        if (replyComposer) replyComposer.classList.add('hidden');
        return;
      }

      viewerToolbar.classList.remove('hidden');
      viewerToolbarActions.innerHTML = renderReaderToolbarActions(session);
      if (document.activeElement !== viewerSearchInput && viewerSearchInput.value !== viewerSearchQuery) {
        viewerSearchInput.value = viewerSearchQuery;
      }
      viewerToolbar.querySelectorAll('button[data-view-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.viewMode === viewerViewMode);
      });
      viewerToolbar.querySelectorAll('button[data-search-scope]').forEach(button => {
        const active = button.dataset.searchScope === viewerSearchScope;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      viewerToolbar.querySelectorAll('button[data-search-field]').forEach(button => {

    function buildReaderMarkup(events, options) {
      resetMessageCopyTexts();
      const output = [];
      let processItems = [];
      let currentQuestionKey = '';
      const selectedKey = options && options.selectedQuestionKey ? options.selectedQuestionKey : '';

      function flushProcessItems() {
        if (!processItems.length) return;
        output.push(renderCollapsedProcessItems(processItems, options));
        processItems = [];
      }

      events.forEach(event => {
        if (!event) return;

        if (['assistant_commentary', 'tool', 'system'].includes(event.kind)) {
          processItems.push(event);
          return;
        }

        if (event.kind === 'user') {
          flushProcessItems();
          currentQuestionKey = event.questionKey || '';
          output.push(renderEvent(event, {
            questionKey: currentQuestionKey,
            isCurrentQuestion: !!event.questionKey && event.questionKey === selectedKey
          }));
          return;
        }

        if (event.kind === 'assistant_final') {
          flushProcessItems();
          output.push(renderEvent(event, { answerForQuestionKey: currentQuestionKey }));
        }
      });

      flushProcessItems();
      return output.join('');
    }

      if (event.key === 'Enter') {
        handleTranscriptEnter(event);
        return;
      }
      if (event.key && event.key.toLowerCase() === 'k') {
        if (runRefreshRequest._running) return;
        event.preventDefault();
        void refreshCurrentSession();
        return;
      }
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        jumpQuestion(-1);
      }
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        jumpQuestion(1);
      }
    });
    workspaceProviderFilter.addEventListener('change', event => {
      if (event.target && event.target.matches('input[type="checkbox"][data-filter-key="provider"]')) {
        toggleFilterValue('provider', event.target.dataset.value);
      }
    });
    workspaceSourceFilter.addEventListener('change', event => {
      if (event.target && event.target.matches('input[type="checkbox"][data-filter-key="source"]')) {
        toggleFilterValue('source', event.target.dataset.value);
      }
    });
    workspaceSortField.addEventListener('change', () => {
      saveSortPrefs();
      renderWorkspaceList();
    });
    workspaceSortDirection.addEventListener('change', () => {
      saveSortPrefs();
      renderWorkspaceList();
    });
    sessionSortField.addEventListener('change', () => {
      saveSortPrefs();
      renderSessionList();
    });
    sessionSortDirection.addEventListener('change', () => {
      saveSortPrefs();
      renderSessionList();
    });
    if (noteContextMenu) {
      noteContextMenu.addEventListener('click', event => {
        const actionButton = event.target && event.target.closest('button[data-note-action]');
        if (!actionButton || !activeNoteTarget) return;
        const action = actionButton.dataset.noteAction;
        const target = activeNoteTarget;
        closeNoteMenu();
        if (action === 'delete') {
          void deleteNoteForTarget(target);
          return;
        }
        openNoteModal(target);
      });
    }
    if (noteModal) {
      noteModal.addEventListener('click', event => {
        if (event.target === noteModal || (event.target && event.target.closest('[data-note-cancel]'))) {
          closeNoteModal();
        }
        if (event.target && event.target.closest('[data-note-save]')) {
          void saveActiveNote();
        }
      });
    }
    if (imagePreviewModal) {
      imagePreviewModal.addEventListener('click', event => {
        if (imagePreviewTransform.dragMoved) {
          imagePreviewTransform.dragMoved = false;
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        const protectedTarget = event.target && event.target.closest
          ? event.target.closest('#imagePreviewImage, #imagePreviewPrev, #imagePreviewNext, #imagePreviewCount, #imagePreviewClose')
          : null;
        if (!protectedTarget) closeImagePreview();
      });
    }
    if (imagePreviewClose) {
      imagePreviewClose.addEventListener('click', closeImagePreview);
    }
    if (imagePreviewPrev) {
      imagePreviewPrev.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        showImagePreviewAt(imagePreviewIndex - 1);
      });
    }
    if (imagePreviewNext) {
      imagePreviewNext.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        showImagePreviewAt(imagePreviewIndex + 1);
      });
    }
    if (imagePreviewStage) {
      imagePreviewStage.addEventListener('wheel', queueImagePreviewZoom, { passive: false });
      imagePreviewStage.addEventListener('pointerdown', handleImagePreviewPointerDown);
      imagePreviewStage.addEventListener('pointermove', handleImagePreviewPointerMove);
      imagePreviewStage.addEventListener('pointerup', handleImagePreviewPointerEnd);
      imagePreviewStage.addEventListener('pointercancel', handleImagePreviewPointerEnd);
    }
    if (imagePreviewImage) {
      imagePreviewImage.addEventListener('dragstart', event => event.preventDefault());
      imagePreviewImage.addEventListener('load', () => {
        imagePreviewImage.hidden = false;
        imagePreviewStatus.hidden = true;
        imagePreviewStatus.textContent = '';
        clampImagePreviewTranslation();
        applyImagePreviewTransform();
      });
      imagePreviewImage.addEventListener('error', () => {
        resetImagePreviewTransform();
        imagePreviewImage.hidden = true;
        imagePreviewStatus.textContent = '图片无法加载';
        imagePreviewStatus.hidden = false;
      });
    }
    if (noteInput) {
      noteInput.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeNoteModal();
          return;
        }
        if (event.key === 'Enter' && event.ctrlKey) {
          event.preventDefault();
          void saveActiveNote();
        }
      });
    }
    document.addEventListener('click', event => {
      if (viewerSearchHistoryControl && !viewerSearchHistoryControl.contains(event.target)) {
        closeSearchHistoryMenu();
      }
      document.querySelectorAll(MENU_SELECTOR + '[open]').forEach(menu => {
        if (!menu.contains(event.target)) {
          menu.removeAttribute('open');
        }
      });
      if (noteContextMenu && !noteContextMenu.hidden && !noteContextMenu.contains(event.target)) {
        closeNoteMenu();
      }
    });
    document.addEventListener('keydown', handleImagePreviewKeydown, true);
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      closeSearchHistoryMenu();
      closeNoteMenu();
      if (noteModal && !noteModal.hidden) closeNoteModal();
      if (webdavModal && !webdavModal.hidden) closeWebdavSettings();
      hideNoteTooltip();
    });

    syncPaneCollapseState();

    (async function boot() {
      loadSearchHistory();
      viewerHead.innerHTML = '<div class="empty-state">正在加载索引...</div>';
      transcript.innerHTML = '';
      try {
        await loadSessionToken();
        await loadWebdavSettings().catch(error => console.warn('云设置读取失败', error));
        await loadSources();
        await loadIndex();
        await loadNotes();
        updateStats();
        refreshFilterMenus();
        renderWorkspaceList(true);
        await loadSelectedDetailIfAvailable();
        renderViewer();
        updateTopSourceActions();
        void refreshCloudSources(true);
        void checkCurrentSourceStatus(true);
        void pollWebdavTask();
      } catch (error) {
        viewerHead.innerHTML = '<div class="empty-state">索引加载失败。</div>';
        transcript.innerHTML = '<div class="empty-state">' + escapeHtml(error.message || '未知错误') + '</div>';
      }
    })();
  </script>
</body>
</html>
