<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>语迹</title>
  <style>
    :root {
      --bg: #f3ede3;
      --paper: #fffaf2;
      --panel: #f7efe2;
      --line: #d9c8ac;
      --ink: #241b13;
      --muted: #7a6d5c;
      --accent: #8f4d1f;
      --accent-soft: #e9d5bf;
      --user: #fbf1e3;
      --assistant: #f1f6ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 0% 0%, rgba(143,77,31,.16), transparent 28rem),
        linear-gradient(135deg, #f7f0e4, var(--bg));
    }
    html,
    body {
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    header {
      flex: none;
      padding: 10px clamp(14px, 4vw, 28px);
      border-bottom: 1px solid var(--line);
      background: rgba(255,250,242,.78);
      backdrop-filter: blur(12px);
      z-index: 5;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .header-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: clamp(20px, 2.4vw, 30px);
      line-height: 1.1;
      flex: none;
    }
    .version-badge {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin-left: 8px;
      padding: 4px 8px;
      border: 1px solid rgba(143,77,31,.28);
      border-radius: 999px;
      background: rgba(233,213,191,.62);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .stat {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.52);
      font-size: 12px;
    }
    .source-selector {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.58);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .source-selector select {
      max-width: min(48vw, 340px);
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }
    .refresh-btn {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(143,77,31,.55);
      border-radius: 12px;
      padding: 10px 16px;
      background: linear-gradient(180deg, rgba(233,213,191,.95), rgba(223,193,164,.95));
      color: #6f3813;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(60,44,27,.08);
    }
    .refresh-btn:disabled {
      cursor: wait;
      opacity: .78;
    }
    .refresh-btn::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(143,77,31,.88), transparent);
      opacity: 0;
      transform: translateX(-120%);
    }
    .refresh-btn.is-loading::after {
      opacity: 1;
      animation: refresh-progress 1.05s linear infinite;
    }
    @keyframes refresh-progress {
      from { transform: translateX(-120%); }
      to { transform: translateX(120%); }
    }
    .refresh-btn:hover {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(239,220,199,.98), rgba(226,198,170,.98));
    }
    .sync-btn[hidden] { display: none !important; }
    .sync-btn.is-error {
      border-color: #a23c32;
      background: #f7d9d3;
      color: #842b23;
    }
    .sync-btn:disabled {
      cursor: default;
      opacity: .55;
    }
    .shell {
      position: relative;
      display: grid;
      grid-template-columns: 240px 320px minmax(0, 1fr);
      flex: 1;
      min-height: 0;
    }
    .shell.is-workspace-collapsed {
      grid-template-columns: 320px minmax(0, 1fr);
    }
    .shell.is-session-collapsed {
      grid-template-columns: 240px minmax(0, 1fr);
    }
    .shell.is-workspace-collapsed.is-session-collapsed {
      grid-template-columns: minmax(0, 1fr);
    }
    .pane {
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(247,239,226,.74);
    }
    .pane.is-collapsed {
      display: none;
    }
    #workspacePane {
      z-index: 30;
    }
    #sessionPane {
      z-index: 20;
    }
    .shell > .viewer {
      z-index: 10;
    }
    .pane + .pane {
      border-left: 1px solid var(--line);
    }
    .pane-header {
      position: relative;
      z-index: 20;
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(217,200,172,.72);
      background: rgba(255,250,242,.7);
    }
    .pane-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: nowrap;
    }
    .pane-title-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: none;
      min-width: 0;
      white-space: nowrap;
    }
    .pane-title {
      margin: 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      white-space: nowrap;
    }
    .sort-menu {
      position: static;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      min-width: 0;
    }
    .pane-collapse-btn,
    .collapsed-controls button {
      border: 1px solid rgba(143,77,31,.24);
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(255,255,255,.62);
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
    .pane-collapse-btn {
      padding: 7px 9px;
      font-size: 12px;
    }
    .pane-collapse-btn:hover,
    .collapsed-controls button:hover {
      border-color: rgba(143,77,31,.52);
      background: var(--accent-soft);
    }
    .collapsed-controls {
      position: absolute;
      z-index: 45;
      left: 10px;
      top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: none;
    }
    .collapsed-controls[hidden] {
      display: none;
    }
    .collapsed-controls button {
      pointer-events: auto;
      box-shadow: 0 10px 22px rgba(60,44,27,.12);
    }
    .collapsed-controls button[hidden] {
      display: none;
    }
    .sort-menu > summary {
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      background: rgba(255,255,255,.56);
      color: var(--accent);
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
    .sort-menu > summary::-webkit-details-marker {
      display: none;
    }
    .sort-menu[open] > summary {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .sort-panel {
      position: absolute;
      right: 12px;
      top: calc(100% + 8px);
      z-index: 1000;
      width: 300px;
      width: min(300px, calc(100% - 24px));
      max-height: min(72vh, 760px);
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--paper);
      box-shadow: 0 22px 54px rgba(60,44,27,.24);
      overflow: auto;
    }
    .sort-panel > label {
      display: block;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .sort-panel select {
      width: 100%;
      margin-top: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
    }
    .filter-group {
      margin-bottom: 12px;
    }
    .filter-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: none;
      overflow: visible;
    }
    .sort-panel .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 38px;
      padding: 7px 9px;
      border-radius: 10px;
      background: rgba(255,255,255,.34);
      font-size: 13px;
      line-height: 1.35;
      color: var(--ink);
      cursor: pointer;
    }
    .sort-panel .check-item:hover {
      background: rgba(255,255,255,.68);
    }
    .sort-panel .check-item input {
      width: auto;
      margin: 0;
      margin-top: 2px;
      accent-color: var(--accent);
      transform: scale(1.05);
      flex: none;
    }
    .sort-panel .check-item span {
      display: block;
      min-height: 20px;
      word-break: break-word;
    }
    .pane input[type="search"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--paper);
      font: inherit;
    }
    .list {
      position: relative;
      overflow: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }
    .workspace-btn,
    .session-btn {
      position: relative;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.5);
      padding: 10px;
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.35;
    }
    .session-btn {
      padding-right: 22px;
    }
    .workspace-btn:hover,
    .session-btn:hover {
      border-color: var(--accent);
      background: rgba(255,255,255,.78);
    }
    .workspace-btn.active,
    .session-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(143,77,31,.08);
    }
    .workspace-name {
      display: block;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .workspace-meta,
    .session-meta {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .session-title {
      display: block;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .title-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .title-group-header {
      position: relative;
      width: 100%;
    }
    .title-group-head {
      position: relative;
      width: 100%;
      text-align: left;
      border: 1px solid rgba(217,200,172,.82);
      border-radius: 14px;
      background: rgba(255,250,242,.72);
      color: var(--ink);
      padding: 9px 22px 9px 10px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.35;
      cursor: pointer;
    }
    .title-group-header.has-toggle .title-group-head {
      padding-right: 42px;
    }
    .title-group-toggle {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 2;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, color .15s ease;
    }
    .title-group-toggle:hover,
    .title-group-toggle:focus-visible {
      background: rgba(143,77,31,.10);
      color: var(--accent);
      outline: none;
    }
    .title-group.collapsed .title-group-toggle {
      transform: rotate(-90deg);
    }
    .title-group-head:hover {
      border-color: var(--accent);
      background: rgba(255,255,255,.82);
    }
    .title-group-head.active {
      border-color: var(--accent);
      background: rgba(233,213,191,.48);
      box-shadow: inset 0 0 0 1px rgba(143,77,31,.08);
    }
    .title-group-title {
      display: block;
      font-weight: 800;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .title-group-meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .title-group-sessions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 10px;
      border-left: 1px solid rgba(217,200,172,.72);
    }
    .title-group.collapsed .title-group-sessions {
      display: none;
    }
    .title-group-head.has-note::after,
    .session-btn.has-note::after {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #b7791f;
      box-shadow: 0 0 0 2px rgba(255,250,242,.9);
      pointer-events: none;
    }
    .title-group-head.active.has-note::after,
    .session-btn.active.has-note::after {
      box-shadow: 0 0 0 2px rgba(255,255,255,.9);
    }
    .note-menu {
      position: fixed;
      z-index: 3000;
      min-width: 132px;
      padding: 6px;
      border: 1px solid rgba(143,77,31,.24);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 18px 44px rgba(60,44,27,.22);
    }
    .note-menu button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 9px 10px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    .note-menu button:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .note-menu[hidden],
    .note-modal[hidden],
    .cloud-modal[hidden],
    .image-preview-modal[hidden],
    .note-tooltip[hidden] {
      display: none !important;
    }
    .note-modal {
      position: fixed;
      inset: 0;
      z-index: 2800;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(36,27,19,.28);
    }
    .cloud-modal {
      position: fixed;
      inset: 0;
      z-index: 2900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(36,27,19,.32);
    }
    .note-modal-card {
      width: min(680px, calc(100vw - 44px));
      max-height: min(84vh, 760px);
      padding: 18px;
      border: 1px solid rgba(143,77,31,.24);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 0 28px 80px rgba(60,44,27,.28);
      overflow: auto;
    }
    .note-modal-card h2 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 18px;
    }
    .note-context {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .note-modal textarea {
      width: 100%;
      min-height: 180px;
      max-height: 52vh;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fffdf7;
      color: var(--ink);
      font: inherit;
      line-height: 1.65;
      resize: vertical;
    }
    .note-modal textarea:focus {
      outline: none;
      border-color: rgba(143,77,31,.55);
      box-shadow: 0 0 0 3px rgba(143,77,31,.10);
    }
    .note-error {
      min-height: 18px;
      margin: 8px 0 0;
      color: #8b2d24;
      font-size: 12px;
    }
    .note-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .note-modal-actions button {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 14px;
      background: var(--paper);
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .note-modal-actions button[data-note-save] {
      border-color: rgba(143,77,31,.55);
      background: linear-gradient(180deg, rgba(233,213,191,.98), rgba(223,193,164,.98));
      color: #6f3813;
    }
    .cloud-settings-card {
      width: min(760px, calc(100vw - 44px));
      max-height: min(90vh, 860px);
    }
    .cloud-settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
    }
    .cloud-settings-grid label {
      display: grid;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .cloud-settings-grid label.cloud-field-wide { grid-column: 1 / -1; }
    .cloud-settings-grid input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: #fffdf7;
      color: var(--ink);
      font: inherit;
    }
    .cloud-check-row {
      display: flex !important;
      grid-template-columns: none !important;
      align-items: center;
      gap: 8px !important;
      padding-top: 4px;
    }
    .cloud-check-row input { width: auto; }
    .cloud-security-note,
    .cloud-status {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .cloud-status.is-error { color: #8b2d24; }
    .cloud-task {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px 12px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .cloud-task progress { width: 100%; height: 10px; }
    #webdavTaskText {
      grid-column: 1 / -1;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .cloud-cache-list {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }
    .cloud-cache-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(217,200,172,.55);
      font-size: 12px;
    }
    .cloud-cache-row button,
    .cloud-task button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 9px;
      background: var(--paper);
      color: var(--accent);
      cursor: pointer;
    }
    .cloud-secondary-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .cloud-secondary-actions button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
    }
    .note-tooltip {
      position: fixed;
      z-index: 3200;
      min-width: 260px;
      max-width: min(70vw, 760px);
      max-height: min(70vh, 620px);
      padding: 12px 14px;
      border: 1px solid rgba(143,77,31,.38);
      border-radius: 14px;
      background: linear-gradient(180deg, #fff8d8, #fff3bd);
      color: #332412;
      box-shadow: 0 20px 54px rgba(60,44,27,.26);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      pointer-events: none;
    }
    .note-tooltip-label {
      display: block;
      margin-bottom: 6px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .note-tooltip-body {
      font-size: 14px;
      line-height: 1.65;
    }
    .viewer {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(255,250,242,.55);
    }
    .viewer-head {
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,250,242,.85);
    }
    .viewer-head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .reader-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
    }
    .reply-composer {
      position: relative;
      padding: 14px 22px 18px;
      border-top: 1px solid rgba(217,200,172,.72);
      background: rgba(255,250,242,.84);
    }
    .reply-composer textarea {
      width: 100%;
      min-height: 64px;
      max-height: 30em;
      resize: none;
      border: 1px solid rgba(143,77,31,.20);
      border-radius: 16px;
      padding: 12px 16px 58px 14px;
      background: rgba(255,255,255,.86);
      color: var(--ink);
      font: inherit;
      line-height: 1.65;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
      scrollbar-width: thin;
    }
    .reply-composer textarea:focus {
      outline: none;
      border-color: rgba(143,77,31,.55);
      box-shadow: 0 0 0 3px rgba(143,77,31,.10);
    }
    .reply-composer-actions {
      position: absolute;
      right: 34px;
      bottom: 30px;
      display: inline-flex;
      align-items: center;
      max-width: calc(100% - 68px);
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }
    .reply-action {
      border: 1px solid rgba(143,77,31,.22);
      border-radius: 10px;
      padding: 7px 10px;
      background: rgba(255,255,255,.92);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(60,44,27,.08);
    }
    .reply-action:hover {
      border-color: rgba(143,77,31,.45);
      background: #fff;
    }
    .reply-action--clear {
      color: var(--muted);
    }
    .quick-refresh-btn {
      border-color: rgba(143,77,31,.62) !important;
      background: linear-gradient(180deg, rgba(233,213,191,.98), rgba(223,193,164,.98)) !important;
      color: #6f3813 !important;
      font-weight: 800;
      box-shadow: 0 10px 20px rgba(60,44,27,.10);
    }
    .reply-action--send {
      border-color: rgba(143,77,31,.62);
      background: linear-gradient(180deg, rgba(233,213,191,.98), rgba(223,193,164,.98));
      color: #6f3813;
      font-weight: 800;
    }
    .search-history-control {
      position: relative;
      flex: 1 1 220px;
      min-width: 180px;
    }
    .reader-toolbar .search-history-control input[type="search"] {
      width: 100%;
      min-width: 0;
      padding-right: 50px;
    }
    .search-history-button {
      position: absolute;
      top: 50%;
      right: 5px;
      transform: translateY(-50%);
      min-width: 38px;
      padding: 5px 7px !important;
      border-color: transparent !important;
      background: transparent !important;
      color: var(--muted) !important;
      box-shadow: none !important;
    }
    .search-history-button:hover,
    .search-history-button[aria-expanded="true"] {
      border-color: rgba(143,77,31,.22) !important;
      background: rgba(233,213,191,.48) !important;
      color: var(--accent) !important;
    }
    .search-history-button:disabled {
      cursor: default;
      opacity: .42;
    }
    .search-history-menu {
      position: absolute;
      z-index: 2400;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      max-height: 50vh;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid rgba(143,77,31,.24);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 18px 44px rgba(60,44,27,.22);
    }
    .search-history-menu[hidden] {
      display: none !important;
    }
    .search-history-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .search-history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: stretch;
      gap: 4px;
      border-radius: 8px;
    }
    .search-history-item.is-active {
      background: var(--accent-soft);
    }
    .reader-toolbar .search-history-value,
    .reader-toolbar .search-history-delete,
    .reader-toolbar .search-history-clear {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }
    .reader-toolbar .search-history-value {
      min-width: 0;
      padding: 8px 9px;
      color: var(--ink);
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .reader-toolbar .search-history-delete {
      align-self: center;
      padding: 7px 9px;
      color: var(--muted);
    }
    .reader-toolbar .search-history-item.is-active .search-history-value,
    .reader-toolbar .search-history-item.is-active .search-history-delete,
    .reader-toolbar .search-history-item:hover .search-history-value,
    .reader-toolbar .search-history-item:hover .search-history-delete {
      color: var(--accent);
    }
    .reader-toolbar .search-history-clear {
      width: 100%;
      margin-top: 5px;
      padding: 8px 9px;
      border-top: 1px solid var(--line);
      border-radius: 0 0 8px 8px;
      color: var(--muted);
    }
    .toolbar-segment {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 12px;
      flex: none;
    }
    .toolbar-segment--view {
      background: rgba(255,255,255,.48);
    }
    .toolbar-segment--search {
      border-color: rgba(143,77,31,.24);
      background: rgba(233,213,191,.34);
    }
    .toolbar-segment--field {
      border-color: rgba(64,106,128,.28);
      background: rgba(232,242,247,.64);
    }
    .toolbar-segment--tools {
      flex: 0 1 auto;
      flex-wrap: wrap;
      border-color: rgba(96,124,74,.24);
      background: rgba(241,246,234,.58);
    }
    .viewer-meta,
    .viewer-path {
      margin: 6px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .viewer-head-row .viewer-meta {
      flex: 1 1 260px;
      margin: 0;
    }
    .viewer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .viewer-actions a,
    .reader-toolbar a,
    .viewer-actions button,
    .reader-toolbar button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--accent);
      padding: 7px 10px;
      font-size: 12px;
      line-height: 1.2;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .reader-toolbar button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(143,77,31,.08);
    }
    .transcript {
      position: relative;
      overflow: auto;
      padding: 20px 22px calc(38px + var(--transcript-scroll-spacer, 0px));
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 10px 28px rgba(60,44,27,.06);
      display: flex;
      flex-direction: column;
      width: fit-content;
      max-width: min(860px, 92%);
    }
    .message.user {
      align-self: flex-end;
      max-width: 80%;
      background: var(--assistant);
    }
    .message-question {
      scroll-margin-top: 16px;
      cursor: pointer;
    }
    .message-question.is-current-question {
      border-color: rgba(143,77,31,.58);
      box-shadow: 0 12px 30px rgba(143,77,31,.12);
    }
    .message.assistant {
      align-self: flex-start;
      width: 100%;
      max-width: 100%;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }
    .message--final { background: rgba(241,246,234,.92); }
    .message.is-search-direct-hit {
      border-left: 3px solid rgba(183,121,31,.82);
      background: rgba(255,248,226,.64);
    }
    .message.is-search-companion {
      border-left: 2px solid rgba(122,109,92,.30);
      background: rgba(247,245,240,.34);
    }
    .message--commentary {
      width: 100%;
      max-width: 100%;
      background: rgba(255,250,242,.88);
      border-style: dashed;
    }
    .message--tool {
      width: 100%;
      max-width: 100%;
      background: rgba(255,255,255,.72);
      font-family: "Cascadia Code","Consolas",monospace;
    }
    .message-blocks { display: flex; flex-direction: column; gap: 12px; }
    .code-block {
      background: #122033;
      color: #ecf3ff;
      border-radius: 14px;
      overflow: auto;
      padding: 12px 14px;
    }
    .collapsed-group {
      align-self: stretch;
      max-width: min(980px, 96%);
    }
    .collapsed-group summary { cursor: pointer; color: var(--accent); }
    .message-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .message-head-main {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .role {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .message-body {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      font-size: 15px;
    }
    .search-hit {
      background: rgba(255, 214, 102, .55);
      border-radius: 3px;
      padding: 0 1px;
    }
    .code-block .search-hit {
      background: rgba(255, 214, 102, .32);
      outline: 1px solid rgba(255, 236, 158, .42);
    }
    .message-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }
    .message-image-button {
      border: 1px solid rgba(143,77,31,.22);
      border-radius: 10px;
      padding: 4px;
      background: rgba(255,255,255,.68);
      cursor: zoom-in;
    }
    .message-image-thumb {
      display: block;
      max-width: min(220px, 56vw);
      max-height: 180px;
      border-radius: 8px;
      object-fit: contain;
    }
    .message-image-status {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .message-image-status[hidden] {
      display: none;
    }
    .image-preview-modal {
      position: fixed;
      inset: 0;
      z-index: 3600;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 54px 18px 22px;
      background: rgba(24,18,12,.72);
      cursor: zoom-out;
    }
    .image-preview-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(calc(100vw - 96px), 1440px);
      height: calc(100vh - 76px);
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: default;
    }
    .image-preview-stage img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      box-shadow: 0 24px 76px rgba(0,0,0,.34);
      object-fit: contain;
      transform-origin: center center;
      user-select: none;
      will-change: transform;
      cursor: inherit;
      -webkit-user-drag: none;
    }
    .image-preview-stage.is-zoomed {
      cursor: grab;
    }
    .image-preview-stage.is-dragging {
      cursor: grabbing;
    }
    .image-preview-nav {
      position: absolute;
      top: 50%;
      z-index: 2;
      min-width: 44px;
      min-height: 44px;
      transform: translateY(-50%);
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 8px;
      background: rgba(255,255,255,.88);
      color: #4d2d16;
      font: inherit;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }
    .image-preview-nav--prev {
      left: 18px;
    }
    .image-preview-nav--next {
      right: 18px;
    }
    .image-preview-nav:disabled {
      opacity: .38;
      cursor: default;
    }
    .image-preview-count {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      padding: 5px 9px;
      border-radius: 7px;
      background: rgba(24,18,12,.76);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }
    .image-preview-status {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(24,18,12,.82);
      color: #fff;
      font-size: 13px;
    }
    .image-preview-count[hidden],
    .image-preview-status[hidden],
    .image-preview-nav[hidden] {
      display: none;
    }
    .image-preview-close {
      position: absolute;
      top: 14px;
      right: 14px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 8px;
      padding: 8px 12px;
      background: rgba(255,255,255,.92);
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }
    .image-preview-close:focus-visible,
    .image-preview-nav:focus-visible {
      outline: 3px solid rgba(255,214,102,.88);
      outline-offset: 2px;
    }
    .message-list {
      margin: 0;
      padding-left: 1.4em;
      line-height: 1.7;
      font-size: 15px;
    }
    .message-table-wrap {
      max-width: 100%;
      overflow: auto;
      border: 1px solid rgba(217,200,172,.72);
      border-radius: 12px;
      background: rgba(255,255,255,.44);
    }
    .message-table {
      width: 100%;
      border-collapse: collapse;
      min-width: max-content;
      font-size: 14px;
      line-height: 1.55;
    }
    .message-table th,
    .message-table td {
      border-bottom: 1px solid rgba(217,200,172,.72);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    .message-table tbody tr:last-child td {
      border-bottom: 0;
    }
    .message-table th {
      background: rgba(233,213,191,.35);
      font-weight: 700;
    }
    .message-table .align-center { text-align: center; }
    .message-table .align-right { text-align: right; }
    .message-copy {
      align-self: center;
      flex: none;
      margin-left: auto;
      border: 1px solid rgba(143,77,31,.22);
      border-radius: 999px;
      background: rgba(255,255,255,.5);
      color: var(--accent);
      padding: 5px 10px;
      font: inherit;
      font-size: 12px;
      line-height: 1.2;
      cursor: pointer;
    }
    .message-copy:hover {
      border-color: var(--accent);
      background: rgba(255,255,255,.82);
    }
    .message-blocks > * {
      margin: 0;
    }
    .empty-state {
      padding: 28px;
      color: var(--muted);
      line-height: 1.7;
    }
    .viewer-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .viewer-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .scroll-top {
      position: sticky;
      bottom: 12px;
      align-self: flex-end;
      margin: auto 12px 4px auto;
      width: 42px;
      height: 42px;
      min-height: 42px;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 999px;
      border: 1px solid rgba(143, 77, 31, .28);
      background: rgba(255,250,242,.72);
      color: var(--accent);
      box-shadow: 0 10px 24px rgba(60,44,27,.12);
      opacity: .72;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .scroll-top:hover {
      opacity: 1;
      border-color: var(--accent);
    }
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 100;
      max-width: min(320px, calc(100vw - 48px));
      padding: 10px 14px;
      border: 1px solid rgba(143,77,31,.22);
      border-radius: 999px;
      background: rgba(36,27,19,.88);
      color: #fffaf2;
      box-shadow: 0 14px 34px rgba(60,44,27,.20);
      font-size: 13px;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: min(720px, calc(100vw - 48px));
      max-height: min(45vh, 320px);
      overflow: auto;
      transition: opacity .16s ease, transform .16s ease;
    }
    .toast--visible {
      opacity: 1;
      transform: translateY(0);
    }
    .toast--error {
      background: rgba(120,43,36,.92);
    }
    .hidden {
      display: none !important;
    }
    @media (min-width: 1280px) {
      .shell {
        grid-template-columns: 300px 400px minmax(0, 1fr);
      }
      .shell.is-workspace-collapsed {
        grid-template-columns: 400px minmax(0, 1fr);
      }
      .shell.is-session-collapsed {
        grid-template-columns: 300px minmax(0, 1fr);
      }
      .shell.is-workspace-collapsed.is-session-collapsed {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
        height: auto;
      }
      .shell.is-workspace-collapsed,
      .shell.is-session-collapsed,
      .shell.is-workspace-collapsed.is-session-collapsed {
        grid-template-columns: 1fr;
      }
      .header-main {
        display: block;
        flex-basis: 100%;
        min-width: 100%;
      }
      .stats {
        margin-top: 8px;
      }
      .viewer-actions {
        margin-top: 10px;
      }
      .message,
      .message.user,
      .message.assistant,
      .collapsed-group {
        max-width: 100%;
      }
      .pane + .pane {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
    @media (max-width: 640px) {
      #viewerToolbar { padding-right: 72px; }
      .image-preview-stage { width: calc(100vw - 24px); }
      .image-preview-nav--prev { left: 8px; }
      .image-preview-nav--next { right: 8px; }
      .cloud-settings-grid { grid-template-columns: minmax(0, 1fr); }
      .cloud-settings-grid label.cloud-field-wide { grid-column: auto; }
      .cloud-cache-row { grid-template-columns: minmax(0, 1fr) auto; }
      .cloud-cache-row button { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header>
      <div class="header-row">
        <div class="header-main">
  <h1>语迹 <span class="version-badge">{{BUILDER_VERSION}}</span></h1>
        <div class="stats">
          <span class="stat" id="statSessions">会话：{{TOTAL_SESSIONS}}</span>
          <span class="stat" id="statWorkspaces">目录：{{TOTAL_WORKSPACES}}</span>
          <span class="stat" id="statArchived">归档：{{ARCHIVED_COUNT}}</span>
          <span class="stat" id="statImages">含图：{{IMAGE_REF_COUNT}}</span>
          <span class="stat" id="statGenerated" title="生成时间：{{GENERATED_AT}}" aria-label="生成时间：{{GENERATED_AT}}">{{GENERATED_AT}}</span>
        </div>
      </div>
      <label class="source-selector" for="sourceSelect"><select id="sourceSelect" aria-label="选择聊天记录来源"><option value="local-codex">本机 Codex</option></select></label>
      <button type="button" id="cloudSettingsButton" class="refresh-btn" title="WebDAV 云设置">云设置</button>
      <button type="button" id="syncButton" class="refresh-btn sync-btn" hidden>上传</button>
      <button type="button" id="refreshButton" class="refresh-btn" onclick="refreshIndex()">刷新</button>
      <button type="button" id="rebuildButton" class="refresh-btn" onclick="rebuildIndex()" title="重新扫描和解析全部聊天记录，耗时可能较长" aria-label="全量重建">全量</button>
      <button type="button" id="globalSidebarToggleButton" class="refresh-btn sidebar-toggle-btn" title="一键收起目录和标题" aria-label="一键收起目录和标题">收起</button>
    </div>
  </header>

  <main class="shell" id="appShell">
    <div id="collapsedControls" class="collapsed-controls" hidden>
      <button type="button" id="expandWorkspacesButton" data-expand-pane="workspaces" hidden>展开目录</button>
      <button type="button" id="expandTitlesButton" data-expand-pane="titles" hidden>展开标题</button>
    </div>
      <section class="pane" id="workspacePane">
        <div class="pane-header">
          <div class="pane-header-row">
            <div class="pane-title-group">
              <p class="pane-title">目录</p>
              <button type="button" id="collapseWorkspacesButton" class="pane-collapse-btn" data-collapse-pane="workspaces" title="收起目录">收起</button>
            </div>
            <div class="header-actions">
              <details class="sort-menu">
                <summary>筛选</summary>
                <div class="sort-panel">
                  <div class="filter-group">
                    <p class="filter-title">provider</p>
                    <div id="workspaceProviderFilter" class="checklist"></div>
                  </div>
                  <div class="filter-group">
                    <p class="filter-title">source</p>
                    <div id="workspaceSourceFilter" class="checklist"></div>
                  </div>
                </div>
              </details>
              <details class="sort-menu">
                <summary>排序</summary>
                <div class="sort-panel">
                  <label>字段
                    <select id="workspaceSortField">
                      <option value="path">路径名字母顺序</option>
                      <option value="updated">最近更新时间</option>
                      <option value="count">会话数量</option>
                    </select>
                  </label>
                  <label>方向
                    <select id="workspaceSortDirection">
                      <option value="asc">升序</option>
                      <option value="desc">降序</option>
                    </select>
                  </label>
                </div>
              </details>
            </div>
          </div>
        <input id="workspaceFilter" type="search" placeholder="筛选工作目录..." oninput="renderWorkspaceList()">
      </div>
      <div id="workspaceList" class="list"></div>
      <button class="scroll-top" type="button" onclick="scrollPaneTop('workspaceList')" title="回到目录列表顶部">↑</button>
    </section>
    <section class="pane" id="sessionPane">
      <div class="pane-header">
